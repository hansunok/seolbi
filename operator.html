<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운영자 — 업체 관리</title>
<script src="config.js"></script>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--line:#e7e9ee;--text:#1f2328;--muted:#6b7280;--accent:#0768df;--danger:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin:10px 0 0}
input{width:100%;padding:9px 11px;border:1px solid #d6d9df;border-radius:9px;font:inherit;margin-top:4px;background:#fff}
input:focus{outline:none;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border:0;border-radius:9px;background:#eceef2;font:inherit;font-weight:600;cursor:pointer;color:inherit}
.btn.primary{background:var(--accent);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{background:#fef2f2;color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.msg{min-height:20px;font-size:14px;margin-top:8px}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
.login{max-width:360px;margin:60px auto}
.list{display:flex;flex-direction:column;gap:10px}
.co{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.co .name{font-weight:700;font-size:16px}
.co .meta{color:var(--muted);font-size:13px;flex:1 1 260px}
.co .acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.tag.on{background:#ecfdf3;color:var(--ok)} .tag.off{background:#fef2f2;color:var(--danger)}
.link{font-size:13px;word-break:break-all;color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginBox" class="card login" hidden>
    <h2>운영자 로그인</h2>
    <form onsubmit="event.preventDefault();login()">
      <label>아이디<input id="lId" autocomplete="username" required></label>
      <label>비밀번호<input id="lPw" type="password" autocomplete="current-password" required></label>
      <div style="margin-top:14px"><button class="btn primary" id="lBtn">로그인</button></div>
      <div class="msg err" id="lMsg"></div>
    </form>
  </div>

  <div id="main" hidden>
    <div class="top"><h1>업체 관리</h1><button class="btn sm" onclick="logout()">로그아웃</button></div>

    <div class="card">
      <h2>+ 새 업체 추가</h2>
      <form onsubmit="event.preventDefault();createCompany()">
        <div class="grid">
          <label>업체명 *<input id="nName" required placeholder="예: 행복설비"></label>
          <label>업체 코드 * (영문 소문자·숫자)<input id="nCode" required placeholder="예: happy" pattern="[a-z0-9][a-z0-9\-]{2,19}" title="영문 소문자·숫자·- 3~20자"></label>
          <label>대표 전화<input id="nPhone" inputmode="tel"></label>
        </div>
        <div class="grid">
          <label>최고관리자 이름 *<input id="nAdmin" required></label>
          <label>관리자 아이디 *<input id="nLogin" required autocomplete="off" pattern="[A-Za-z0-9_.\-]{3,30}" title="영문/숫자 3~30자"></label>
          <label>처음 비밀번호 * (6자 이상)<input id="nPw" required autocomplete="new-password" minlength="6"></label>
        </div>
        <p class="hint">업체 코드는 접속 주소에 들어갑니다 (나중에 바꿀 수 없어요). 처음 비밀번호는 업체에 알려 주고, 로그인 후 바꾸게 해 주세요.</p>
        <div style="margin-top:12px"><button class="btn primary" id="nBtn">업체 추가</button></div>
        <div class="msg" id="nMsg"></div>
      </form>
    </div>

    <div class="card">
      <h2>업체 협력 — 제안받기 승인 <span id="shCnt" style="color:var(--muted);font-weight:400"></span></h2>
      <p class="hint" style="margin-top:0">업체가 '타업체에서 서비스 제안받기'를 켜면 여기에 승인 요청이 옵니다. 승인한 업체끼리만 제휴·배정을 할 수 있습니다.</p>
      <div class="list" id="shList">불러오는 중...</div>
    </div>

    <div class="card">
      <h2>업체 목록 <span id="cnt" style="color:var(--muted);font-weight:400"></span></h2>
      <div class="list" id="list">불러오는 중...</div>
    </div>
  </div>
</div>
<script>
const TK = "op_token";
let token = "";
try { token = sessionStorage.getItem(TK) || ""; } catch (e) {}
function $(id) { return document.getElementById(id); }
function esc(v) { return v == null ? "" : String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
async function call(action, payload) {
  const r = await fetch(window.API_BASE, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, payload: payload || {}, op_token: token }) });
  const j = await r.json();
  if (!j.ok) { if (j.code === "OP_AUTH") showLogin(); throw new Error(j.error || "오류"); }
  return j.data;
}
function showLogin() { $("main").hidden = true; $("loginBox").hidden = false; }
async function login() {
  $("lBtn").disabled = true; $("lMsg").textContent = "";
  try {
    const d = await call("op_login", { login_id: $("lId").value.trim(), password: $("lPw").value });
    token = d.token; try { sessionStorage.setItem(TK, token); } catch (e) {}
    $("lPw").value = ""; await start();
  } catch (e) { $("lMsg").textContent = e.message; }
  $("lBtn").disabled = false;
}
async function logout() { try { await call("op_logout"); } catch (e) {} token = ""; try { sessionStorage.removeItem(TK); } catch (e) {} showLogin(); }
function appLink(code) { return new URL("index.html?c=" + encodeURIComponent(code), location.href).href; }
async function load() {
  const rows = await call("op_companies");
  $("cnt").textContent = rows.length + "곳";
  $("list").innerHTML = rows.map(c => `
    <div class="co">
      <div style="flex:1 1 200px"><div class="name">${esc(c.name)} <span class="tag ${c.active ? "on" : "off"}">${c.active ? "사용 중" : "중지"}</span></div>
        <div class="meta">코드 <b>${esc(c.code)}</b> · 최고관리자 ${esc((c.super_logins || []).join(", ") || "-")} · 고객 ${c.customers} · 예약 ${c.reservations} · 등록 ${esc(c.created_at)}</div>
        <div class="link">${esc(appLink(c.code))}</div></div>
      <div class="acts">
        <button class="btn sm" onclick="copyLink('${esc(c.code)}')">주소 복사</button>
        <button class="btn sm" onclick="resetPw('${esc(c.company_id)}','${esc(c.name)}')">비밀번호 초기화</button>
        <button class="btn sm ${c.active ? "danger" : ""}" onclick="toggle('${esc(c.company_id)}',${!c.active},'${esc(c.name)}')">${c.active ? "사용 중지" : "다시 사용"}</button>
      </div>
    </div>`).join("") || "등록된 업체가 없습니다.";
}
async function loadShare() {
  const rows = await call("op_share_list");
  const wait = rows.filter(x => x.approved === "대기").length;
  $("shCnt").textContent = wait ? `승인 대기 ${wait}곳` : "";
  const order = { "대기": 0, "보류": 1, "승인": 2, "미신청": 3 };
  rows.sort((a, b) => (order[a.approved] ?? 9) - (order[b.approved] ?? 9));
  $("shList").innerHTML = rows.map(x => `
    <div class="co">
      <div style="flex:1 1 220px"><div class="name">${esc(x.name || x.company_id)} <span class="tag ${x.approved === "승인" ? "on" : "off"}">${esc(x.approved)}</span> ${x.enabled ? "" : '<span class="tag off">제안받기 꺼짐</span>'} ${x.warn ? '<span class="tag off">⚠️ 확인 필요</span>' : ""}</div>
        <div class="meta">분류 ${esc((x.categories || []).join(", "))} · 지역 ${esc(x.areas.slice(0, 10).join(", "))}${x.areas.length > 10 ? ` 외 ${x.areas.length - 10}곳` : ""}</div>
        <div class="meta">평가 ${x.review_count}건${x.avg_stars != null ? ` · 평균 ★${x.avg_stars}` : ""} · 완료 ${x.done_count}건 · 수락 후 취소 ${x.cancel_count}건</div></div>
      <div class="acts">
        ${x.approved !== "승인" ? `<button class="btn sm primary" onclick="shApprove('${esc(x.company_id)}','승인')">승인</button>` : ""}
        ${x.approved !== "보류" ? `<button class="btn sm danger" onclick="shApprove('${esc(x.company_id)}','보류')">보류</button>` : ""}
      </div>
    </div>`).join("") || "아직 신청한 업체가 없습니다.";
}
async function shApprove(id, v) {
  if (v === "보류" && !confirm("보류하면 이 업체는 제휴 찾기·배정 요청에서 빠집니다. 계속할까요?")) return;
  try { await call("op_share_approve", { company_id: id, approved: v }); await loadShare(); } catch (e) { alert(e.message); }
}
async function start() { $("loginBox").hidden = true; $("main").hidden = false; try { await load(); } catch (e) { $("list").textContent = e.message; } try { await loadShare(); } catch (e) { $("shList").textContent = e.message; } }
async function createCompany() {
  const m = $("nMsg"); m.className = "msg"; m.textContent = ""; $("nBtn").disabled = true;
  try {
    const d = await call("op_company_create", { name: $("nName").value.trim(), code: $("nCode").value.trim().toLowerCase(), phone: $("nPhone").value.trim(), admin_name: $("nAdmin").value.trim(), login_id: $("nLogin").value.trim(), password: $("nPw").value, base_url: new URL("./", location.href).href });
    m.className = "msg ok"; m.innerHTML = `추가했습니다. 접속 주소: <span class="link">${esc(appLink(d.code))}</span>`;
    ["nName", "nCode", "nPhone", "nAdmin", "nLogin", "nPw"].forEach(id => $(id).value = "");
    await load();
  } catch (e) { m.className = "msg err"; m.textContent = e.message; }
  $("nBtn").disabled = false;
}
async function copyLink(code) { try { await navigator.clipboard.writeText(appLink(code)); alert("주소를 복사했습니다."); } catch (e) { prompt("주소를 복사하세요", appLink(code)); } }
async function toggle(id, active, name) {
  if (!confirm(`${name} 업체를 ${active ? "다시 사용" : "사용 중지"}할까요?` + (active ? "" : "\n중지하면 그 업체 직원과 고객 링크가 모두 접속되지 않습니다. (데이터는 그대로)"))) return;
  try { await call("op_company_update", { company_id: id, active }); await load(); } catch (e) { alert(e.message); }
}
async function resetPw(id, name) {
  const login = prompt(`${name}: 비밀번호를 초기화할 관리자 아이디`); if (!login) return;
  const pw = prompt("새 비밀번호 (6자 이상)"); if (!pw) return;
  try { await call("op_reset_admin", { company_id: id, login_id: login.trim(), password: pw }); alert("바꿨습니다."); } catch (e) { alert(e.message); }
}
if (token) start(); else showLogin();
</script>
</body>
</html>
