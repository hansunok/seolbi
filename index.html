<script>
/* ===== 매출 · 미수금 · 지출 · 통계 ===== */
const Sal = { tab: "list", from: "", to: "", q: "", status: "", list: [], recv: [], recvView: "sale", recvSort: "old" };

Views.sales = {
  async render(el, params) {
    if (params.tab) Sal.tab = params.tab;
    if (params.from !== undefined) { Sal.from = params.from; Sal.to = params.to || params.from; }
    if (!Sal.from && !Sal.to && !params.from) { const d = new Date(); Sal.from = ymd(new Date(d.getFullYear(), d.getMonth(), 1)); Sal.to = todayStr(); }
    el.innerHTML = `
      <div class="page-head"><h2>매출 · 미수금</h2></div>
      <div class="tabs"><button data-t="list">매출 내역</button><button data-t="recv">미수금 <span class="badge" id="recvBadge" hidden></span></button><button data-t="exp">지출</button></div>
      <div id="salBody"></div>`;
    el.querySelectorAll(".tabs button").forEach(b => { b.classList.toggle("active", b.dataset.t === Sal.tab); b.onclick = () => { Sal.tab = b.dataset.t; Views.sales.render(el, {}); }; });
    if (Sal.tab === "recv") return renderRecv();
    if (Sal.tab === "exp") return renderExpenses();
    return renderSalesList();
  }
};

async function renderSalesList() {
  const box = document.getElementById("salBody");
  box.innerHTML = `
    <div class="cards"><div class="card"><div class="label">기간 매출</div><div class="value" id="sTotal">-</div></div><div class="card"><div class="label">입금</div><div class="value green" id="sPaid">-</div></div><div class="card"><div class="label">미수</div><div class="value red" id="sRemain">-</div></div><div class="card"><div class="label">건수</div><div class="value" id="sCount">-</div></div></div>
    <div class="panel">
      <div class="filters">
        <input type="date" id="sFrom" value="${Sal.from}"><input type="date" id="sTo" value="${Sal.to}">
        <select id="sStatus"><option value="">전체 결제상태</option><option>결제완료</option><option>부분결제</option><option>미결제</option></select>
        <input type="search" id="sQ" class="grow" placeholder="고객·서비스·매출번호" value="${esc(Sal.q)}">
      </div>
      <div class="quick"><button class="btn sm" data-r="today">오늘</button><button class="btn sm" data-r="month">이번 달</button><button class="btn sm" data-r="last">지난 달</button><button class="btn sm" data-r="all">전체</button></div>
      <div class="table-wrap"><table class="tbl cards-sm"><thead><tr><th>매출일</th><th>고객</th><th>서비스</th><th>담당</th><th class="num">서비스</th><th class="num">부품</th><th class="num">총액</th><th class="num">입금</th><th>상태</th><th></th></tr></thead><tbody id="sBody"></tbody></table></div>
      <div id="sEmpty" class="empty" hidden>매출이 없습니다.</div>
    </div>`;
  document.getElementById("sStatus").value = Sal.status;
  const reload = async () => {
    Sal.from = val("sFrom"); Sal.to = val("sTo");
    try { Sal.list = await api("sales", { from: Sal.from, to: Sal.to }); drawSales(); } catch (e) { toast(e.message, true); }
  };
  document.getElementById("sFrom").onchange = reload; document.getElementById("sTo").onchange = reload;
  document.getElementById("sStatus").onchange = () => { Sal.status = val("sStatus"); drawSales(); };
  document.getElementById("sQ").oninput = debounce(() => { Sal.q = val("sQ"); drawSales(); });
  box.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    const d = new Date(), k = b.dataset.r; let a = "", z = "";
    if (k === "today") a = z = todayStr();
    if (k === "month") { a = ymd(new Date(d.getFullYear(), d.getMonth(), 1)); z = todayStr(); }
    if (k === "last") { a = ymd(new Date(d.getFullYear(), d.getMonth() - 1, 1)); z = ymd(new Date(d.getFullYear(), d.getMonth(), 0)); }
    document.getElementById("sFrom").value = a; document.getElementById("sTo").value = z; reload();
  });
  await reload();
}
function drawSales() {
  const q = kw(Sal.q);
  const rows = Sal.list.filter(s => (!Sal.status || s.status === Sal.status) && (!q || kw([s.customer_name, s.customer_phone, s.service_name, s.sales_id, s.reservation_id].join(" ")).includes(q)));
  const sum = f => rows.reduce((a, s) => a + s[f], 0);
  document.getElementById("sTotal").textContent = money(sum("total_amount"));
  document.getElementById("sPaid").textContent = money(sum("paid_amount"));
  document.getElementById("sRemain").textContent = money(sum("remaining"));
  document.getElementById("sCount").textContent = rows.length + "건";
  document.getElementById("sEmpty").hidden = !!rows.length;
  document.getElementById("sBody").innerHTML = rows.map((s, i) => `<tr class="click" data-i="${Sal.list.indexOf(s)}">
    <td data-l="매출일" class="nowrap">${esc(s.sale_datetime.slice(0, 16))}</td><td data-l="고객"><b>${esc(s.customer_name)}</b></td><td data-l="서비스">${esc(s.service_name)}</td>
    <td data-l="담당">${esc(adminName(s.assignee_id))}</td><td data-l="서비스" class="num">${money(s.service_revenue)}</td><td data-l="부품" class="num">${money(s.parts_revenue)}</td>
    <td data-l="총액" class="num b">${money(s.total_amount)}</td><td data-l="입금" class="num">${money(s.paid_amount)}</td><td data-l="상태">${payPill(s.status)}</td>
    <td>${s.remaining > 0 ? `<button class="btn sm accent" data-pay="${Sal.list.indexOf(s)}">입금</button>` : ""}</td></tr>`).join("");
  document.querySelectorAll("#sBody tr").forEach(tr => tr.onclick = e => {
    const s = Sal.list[tr.dataset.i];
    if (e.target.dataset.pay !== undefined) { e.stopPropagation(); return openPaymentForm(s, renderSalesList); }
    if (s.reservation_id) openReservationDetail(s.reservation_id); else openPaymentForm(s, renderSalesList);
  });
}

/* ---------- 미수금 ---------- */
async function renderRecv() {
  const box = document.getElementById("salBody");
  box.innerHTML = `
    <div class="cards"><div class="card"><div class="label">미수 건수</div><div class="value" id="rvCount">-</div></div><div class="card"><div class="label">미수금 합계</div><div class="value red" id="rvSum">-</div></div><div class="card"><div class="label">30일 넘은 미수</div><div class="value" id="rvOld">-</div></div><div class="card"><div class="label">미수 고객</div><div class="value" id="rvCust">-</div></div></div>
    <div class="panel">
      <div class="panel-head"><h3>미수금 목록</h3><div class="tabs" style="margin:0"><button data-v="sale">건별</button><button data-v="cust">고객별</button></div></div>
      <div class="filters"><input type="search" id="rvQ" class="grow" placeholder="고객·전화·서비스"><select id="rvSort"><option value="old">오래된 순</option><option value="amount">금액 큰 순</option><option value="recent">최근 순</option></select></div>
      <div id="rvList"><div class="empty">불러오는 중...</div></div>
    </div>`;
  box.querySelectorAll("[data-v]").forEach(b => { b.classList.toggle("active", b.dataset.v === Sal.recvView); b.onclick = () => { Sal.recvView = b.dataset.v; box.querySelectorAll("[data-v]").forEach(x => x.classList.toggle("active", x === b)); drawRecv(); }; });
  document.getElementById("rvSort").value = Sal.recvSort;
  document.getElementById("rvSort").onchange = () => { Sal.recvSort = val("rvSort"); drawRecv(); };
  document.getElementById("rvQ").oninput = debounce(drawRecv);
  try { Sal.recv = await api("receivables"); } catch (e) { return toast(e.message, true); }
  const sum = Sal.recv.reduce((a, s) => a + s.remaining, 0);
  document.getElementById("rvCount").textContent = Sal.recv.length + "건";
  document.getElementById("rvSum").textContent = money(sum);
  document.getElementById("rvOld").textContent = money(Sal.recv.filter(s => s.days >= 30).reduce((a, s) => a + s.remaining, 0));
  document.getElementById("rvCust").textContent = new Set(Sal.recv.map(s => s.customer_id)).size + "명";
  setNavBadge("sales", Sal.recv.length);
  drawRecv();
}
function recvItem(s) {
  const pct = s.total_amount ? Math.min(100, Math.round(s.paid_amount / s.total_amount * 100)) : 0;
  return `<div class="item" style="cursor:default">
    <div class="main-col">
      <div class="row"><b>${esc(s.customer_name)}</b>${telLink(s.customer_phone)}${ageBadge(s.days)}${payPill(s.status)}</div>
      <div class="sub">${esc(s.service_name)} · ${esc(s.sale_date)} · <span class="faint">${esc(s.sales_id)}</span></div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="xs muted">총 ${money(s.total_amount)} 중 ${money(s.paid_amount)} 입금 (${pct}%)${s.last_paid_at ? " · 최근 입금 " + esc(s.last_paid_at.slice(0, 10)) : " · 입금 없음"}</div>
    </div>
    <div class="side-col"><div class="xs muted">남은 금액</div><div class="b red" style="font-size:19px">${money(s.remaining)}</div>
      <div class="row" style="justify-content:flex-end;margin-top:4px">${s.reservation_id ? `<button class="btn sm" onclick="openReservationDetail('${esc(s.reservation_id)}')">예약</button>` : ""}<button class="btn sm accent" onclick="openPaymentForm(Sal.recv.find(x=>x.sales_id==='${esc(s.sales_id)}'), renderRecv)">입금 처리</button></div></div>
  </div>`;
}
function drawRecv() {
  const q = kw(val("rvQ"));
  let rows = Sal.recv.filter(s => !q || kw([s.customer_name, s.customer_phone, s.service_name, s.sales_id].join(" ")).includes(q));
  const sorter = { old: (a, b) => b.days - a.days, amount: (a, b) => b.remaining - a.remaining, recent: (a, b) => a.days - b.days }[Sal.recvSort];
  rows.sort(sorter);
  const box = document.getElementById("rvList");
  if (!Sal.recv.length) { box.innerHTML = '<div class="empty">미수금이 없습니다 👍</div>'; return; }
  if (Sal.recvView === "sale") { box.innerHTML = rows.map(recvItem).join("") || '<div class="empty">검색 결과가 없습니다.</div>'; return; }
  const g = {};
  rows.forEach(s => { (g[s.customer_id] = g[s.customer_id] || { name: s.customer_name, phone: s.customer_phone, items: [] }).items.push(s); });
  const groups = Object.values(g).map(x => Object.assign(x, { sum: x.items.reduce((a, s) => a + s.remaining, 0), oldest: Math.max(...x.items.map(s => s.days)) }));
  groups.sort(Sal.recvSort === "amount" ? (a, b) => b.sum - a.sum : (a, b) => b.oldest - a.oldest);
  box.innerHTML = groups.map(x => `<details class="group" ${groups.length <= 3 ? "open" : ""}><summary><div><b>${esc(x.name)}</b> ${telLink(x.phone)}<div class="xs muted">${x.items.length}건 · 가장 오래된 건 ${ageBadge(x.oldest)}</div></div><div class="right"><div class="xs muted">합계</div><div class="b red" style="font-size:18px">${money(x.sum)}</div></div></summary><div style="padding:0 10px">${x.items.map(recvItem).join("")}</div></details>`).join("");
}

/* ---------- 입금 처리 ---------- */
function openPaymentForm(s, after) {
  if (!s) return;
  const now = new Date(), local = ymd(now) + "T" + pad(now.getHours()) + ":" + pad(now.getMinutes());
  const m = openModal({
    title: "입금 처리",
    body: `<div class="box"><b>${esc(s.customer_name)}</b> · ${esc(s.service_name)}<div class="sum-row"><span>총액</span><span>${money(s.total_amount)}</span></div><div class="sum-row"><span>입금</span><span class="green">${money(s.paid_amount)}</span></div><div class="sum-row total"><span>남은 금액</span><span class="red">${money(s.remaining)}</span></div></div>
      <div class="grid2"><label>입금 금액<input type="number" id="pyAmt" min="1" value="${s.remaining}"></label><label>입금 일시<input type="datetime-local" id="pyDt" value="${local}"></label>
      <label>결제수단<select id="pyMethod"><option>계좌이체</option><option>현금</option><option>카드</option><option>기타</option></select></label><label>승인/거래번호<input id="pyNo"></label>
      <label class="span2">메모<input id="pyMemo"></label></div>
      ${(s.payments || []).length ? `<div class="section-title">입금 내역</div><div class="box small">${s.payments.map(p => `<div class="sum-row"><span>${esc(p.payment_datetime.slice(0, 16))} · ${esc(p.method)} · ${esc(adminName(p.admin_id))} ${p.status === "취소" ? '<span class="pill danger">취소</span>' : ""}</span><span>${money(p.amount)} ${isSuper() && p.status !== "취소" ? `<button class="btn sm danger" data-cancel="${esc(p.payment_id)}">취소</button>` : ""}</span></div>`).join("")}</div>` : ""}`,
    foot: `<button class="btn" data-x>닫기</button><button class="btn accent" id="pySave">입금 저장</button>`
  });
  m.$("[data-x]").onclick = m.close;
  m.$$("[data-cancel]").forEach(b => b.onclick = async () => {
    if (!(await confirmBox("이 입금 내역을 취소할까요? (잘못 입력한 경우)", "입금 취소"))) return;
    await run(() => api("payment_cancel", { payment_id: b.dataset.cancel, reason: "관리자 취소" }), "입금을 취소했습니다.");
    m.close(); if (after) after();
  });
  m.$("#pySave").onclick = async () => {
    const amt = num(m.$("#pyAmt").value);
    if (amt <= 0) return toast("금액을 입력하세요.", true);
    if (amt > s.remaining) return toast("남은 금액보다 많습니다.", true);
    m.$("#pySave").disabled = true;
    try {
      const r = await api("payment_record", { sales_id: s.sales_id, amount: amt, payment_datetime: m.$("#pyDt").value, method: m.$("#pyMethod").value, approval_no: m.$("#pyNo").value, memo: m.$("#pyMemo").value });
      toast(r.remaining > 0 ? `입금 저장 · 남은 금액 ${money(r.remaining)}` : "완납되었습니다.");
      m.close(); if (after) after();
    } catch (e) { toast(e.message, true); m.$("#pySave").disabled = false; }
  };
}

async function renderExpenses() {

    <div class="filters"><input type="date" id="exFrom" value="${from}"><input type="date" id="exTo" value="${todayStr()}"></div>

<script>
/* ===== 부품·재고 / 서비스·가격 ===== */
const Inv = { tab: "parts", low: false, q: "", parts: [] };

Views.inventory = {
  async render(el, params) {
    if (params.low) { Inv.low = true; Inv.tab = "parts"; }
    el.innerHTML = `<div class="page-head"><h2>부품 · 재고</h2><div class="row"><button class="btn" onclick="openStockForm()">± 입고/출고/조정</button><button class="btn primary" onclick="openPartForm()">+ 부품 등록</button></div></div>
      <div class="tabs"><button data-t="parts">부품 목록</button><button data-t="history">입출고 내역</button></div><div id="invBody"></div>`;
    el.querySelectorAll(".tabs button").forEach(b => { b.classList.toggle("active", b.dataset.t === Inv.tab); b.onclick = () => { Inv.tab = b.dataset.t; Views.inventory.render(el, {}); }; });
    try { Inv.parts = await api("parts"); } catch (e) { return toast(e.message, true); }
    if (Inv.tab === "history") return renderInvHistory();
    renderParts();
  }
};
function renderParts() {
  const box = document.getElementById("invBody");
  const low = Inv.parts.filter(p => p.low).length, value = Inv.parts.reduce((a, p) => a + p.inventory_value, 0);
  box.innerHTML = `<div class="cards" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="label">부품 수</div><div class="value">${Inv.parts.length}개</div></div><div class="card"><div class="label">재고 주의</div><div class="value ${low ? "red" : ""}">${low}개</div></div><div class="card"><div class="label">재고 금액(평균원가)</div><div class="value">${money(value)}</div></div></div>
    <div class="panel"><div class="filters"><input type="search" id="pQ" class="grow" placeholder="부품명·분류·규격" value="${esc(Inv.q)}"><label class="check" style="margin:0"><input type="checkbox" id="pLow" ${Inv.low ? "checked" : ""}> 재고주의만</label></div>
    <div class="table-wrap"><table class="tbl cards-sm"><thead><tr><th>부품</th><th>분류</th><th class="num">현재재고</th><th class="num">안전재고</th><th class="num">평균원가</th><th class="num">청구단가</th><th>상태</th><th></th></tr></thead><tbody id="pBody"></tbody></table></div></div>`;
  const draw = () => {
    const q = kw(Inv.q);
    const rows = Inv.parts.filter(p => (!Inv.low || p.low) && (!q || kw([p.part_name, p.category, p.model_spec, p.part_id].join(" ")).includes(q)));
    document.getElementById("pBody").innerHTML = rows.map(p => `<tr class="click" data-id="${esc(p.part_id)}">
      <td data-l="부품"><b>${esc(p.part_name)}</b> <span class="xs muted">${esc(p.model_spec)} · ${esc(p.part_id)}</span></td><td data-l="분류">${esc(p.category)}</td>
      <td data-l="현재재고" class="num b ${p.low ? "red" : ""}">${p.current_stock} ${esc(p.unit)}</td><td data-l="안전재고" class="num">${p.safety_stock}</td>
      <td data-l="평균원가" class="num">${money(p.average_cost)}</td><td data-l="청구단가" class="num">${money(p.sale_price)}</td>
      <td data-l="상태">${p.active !== "Y" ? '<span class="pill">미사용</span>' : p.low ? '<span class="pill danger">재고주의</span>' : '<span class="pill ok">정상</span>'}</td>
      <td><button class="btn sm" data-stock="${esc(p.part_id)}">입출고</button></td></tr>`).join("") || '<tr><td colspan="8" class="empty">부품이 없습니다.</td></tr>';
    document.querySelectorAll("#pBody tr[data-id]").forEach(tr => tr.onclick = e => {
      if (e.target.dataset.stock) { e.stopPropagation(); return openStockForm(e.target.dataset.stock); }
      openPartForm(Inv.parts.find(p => p.part_id === tr.dataset.id));
    });
  };
  document.getElementById("pQ").oninput = debounce(() => { Inv.q = val("pQ"); draw(); });
  document.getElementById("pLow").onchange = e => { Inv.low = e.target.checked; draw(); };
  draw();
}
async function renderInvHistory() {
  const box = document.getElementById("invBody");
  box.innerHTML = `<div class="panel"><div class="filters"><select id="hPart"><option value="">전체 부품</option>${Inv.parts.map(p => `<option value="${esc(p.part_id)}">${esc(p.part_name)}</option>`).join("")}</select></div><div id="hList"></div></div>`;
  const load = async () => {
    const list = await api("inventory_history", { part_id: val("hPart") });
    document.getElementById("hList").innerHTML = `<div class="table-wrap"><table class="tbl cards-sm"><thead><tr><th>일시</th><th>부품</th><th>구분</th><th class="num">수량</th><th class="num">단가</th><th class="num">처리후</th><th>사유</th><th>처리자</th></tr></thead><tbody>${list.map(t => `<tr><td data-l="일시" class="nowrap">${esc(t.tx_datetime.slice(0, 16))}</td><td data-l="부품">${esc(t.part_name)}</td><td data-l="구분"><span class="pill ${t.tx_type === "입고" ? "ok" : t.tx_type === "출고" ? "warn" : "info"}">${esc(t.tx_type)}</span></td><td data-l="수량" class="num">${t.tx_type === "출고" ? "-" + Math.abs(t.quantity) : t.tx_type === "입고" ? "+" + Math.abs(t.quantity) : (t.quantity > 0 ? "+" : "") + t.quantity}</td><td data-l="단가" class="num">${money(t.unit_cost)}</td><td data-l="처리후" class="num">${t.stock_after === "" ? "-" : t.stock_after}</td><td data-l="사유">${esc(t.reason)}${t.reservation_id ? ` <a href="#" onclick="event.preventDefault();openReservationDetail('${esc(t.reservation_id)}')">예약</a>` : ""}</td><td data-l="처리자">${esc(adminName(t.admin_id))}</td></tr>`).join("") || '<tr><td colspan="8" class="empty">내역이 없습니다.</td></tr>'}</tbody></table></div>`;
  };
  document.getElementById("hPart").onchange = load;
  await load();
}

function openPartForm(p, onSaved) {
  p = p || {};
  const isNew = !p.part_id;
  const m = openModal({
    title: isNew ? "부품 등록" : "부품 수정",
    body: `<div class="grid2"><label>부품명 *<input id="pfName" value="${esc(p.part_name)}"></label><label>분류<input id="pfCat" value="${esc(p.category)}" placeholder="예: 씽크대수전"></label>
      <label>규격/모델<input id="pfSpec" value="${esc(p.model_spec)}"></label><label>단위<input id="pfUnit" value="${esc(p.unit || "개")}"></label>
      <label>매입단가<input type="number" id="pfBuy" value="${p.purchase_price || 0}"></label><label>청구단가 (고객에게)<input type="number" id="pfSell" value="${p.sale_price || 0}"></label>
      <label>안전재고 (이하이면 경고)<input type="number" id="pfSafe" value="${p.safety_stock || 0}"></label>
      ${isNew ? `<label>처음 재고<input type="number" id="pfInit" value="0"></label>` : `<div><label>현재재고</label><div class="b" style="padding:10px 0">${p.current_stock} ${esc(p.unit)} <span class="xs muted">(입출고로 변경)</span></div></div>`}
      <label>거래처<input id="pfSup" value="${esc(p.supplier)}"></label><label>보관위치<input id="pfLoc" value="${esc(p.location)}"></label>
      <label>사용<select id="pfAct"><option value="Y">사용</option><option value="N">미사용</option></select></label><label class="span2">메모<input id="pfMemo" value="${esc(p.memo)}"></label></div>`,
    foot: `${isNew ? "" : `<button class="btn" id="pfStock">입출고</button>`}<button class="btn" data-x>취소</button><button class="btn primary" id="pfSave">저장</button>`
  });
  m.$("#pfAct").value = p.active || "Y";
  m.$("[data-x]").onclick = m.close;
  if (!isNew) m.$("#pfStock").onclick = () => { m.close(); openStockForm(p.part_id); };
  m.$("#pfSave").onclick = async () => {
    const saved = await run(() => api("part_save", { part_id: p.part_id || "", part_name: m.$("#pfName").value, category: m.$("#pfCat").value, model_spec: m.$("#pfSpec").value, unit: m.$("#pfUnit").value, purchase_price: m.$("#pfBuy").value, sale_price: m.$("#pfSell").value, safety_stock: m.$("#pfSafe").value, initial_stock: isNew ? m.$("#pfInit").value : 0, supplier: m.$("#pfSup").value, location: m.$("#pfLoc").value, active: m.$("#pfAct").value, memo: m.$("#pfMemo").value }), "부품을 저장했습니다.");
    m.close();
    if (onSaved) onSaved(saved || {}); else refreshView();
  };
}

async function openStockForm(partId) {
  if (!Inv.parts.length) try { Inv.parts = await api("parts"); } catch (e) {}
  const m = openModal({
    title: "재고 입고 / 출고 / 조정",
    body: `<label>부품<select id="sfPart">${Inv.parts.map(p => `<option value="${esc(p.part_id)}">${esc(p.part_name)} ${esc(p.model_spec)} (재고 ${p.current_stock})</option>`).join("")}</select></label>
      <div class="tabs" id="sfType" style="margin-top:12px"><button data-t="입고" class="active">입고</button><button data-t="출고">출고</button><button data-t="조정">재고 조정</button></div>
      <div class="grid2"><label id="sfQtyL">입고 수량<input type="number" id="sfQty" min="0" value="1"></label><label id="sfCostL">입고 단가 (1개당)<input type="number" id="sfCost"></label>
      <label class="span2">사유<input id="sfReason" placeholder="예: 쿠팡 구매, 파손, 실사"></label></div>
      <div class="box small" id="sfInfo" style="margin-top:10px"></div>`,
    foot: `<button class="btn" data-x>취소</button><button class="btn primary" id="sfSave">저장</button>`
  });
  m.$("[data-x]").onclick = m.close;
  let type = "입고";
  if (partId) m.$("#sfPart").value = partId;
  const info = () => {
    const p = Inv.parts.find(x => x.part_id === m.$("#sfPart").value) || {};
    if (!m.$("#sfCost").value) m.$("#sfCost").placeholder = String(p.purchase_price || 0);
    m.$("#sfQtyL").firstChild.textContent = type === "조정" ? "실제 재고 수량 (세어 본 수량)" : type + " 수량";
    m.$("#sfCostL").hidden = type !== "입고";
    const q = num(m.$("#sfQty").value), cur = p.current_stock || 0;
    const after = type === "입고" ? cur + q : type === "출고" ? cur - q : q;
    m.$("#sfInfo").innerHTML = `현재 <b>${cur}</b> → 처리 후 <b class="${after < 0 ? "red" : ""}">${after}</b> ${esc(p.unit || "")}${type === "입고" ? ` · 평균원가 ${money(p.average_cost)} → 입고 단가로 다시 계산` : ""}`;
  };
  m.$$("#sfType button").forEach(b => b.onclick = () => { type = b.dataset.t; m.$$("#sfType button").forEach(x => x.classList.toggle("active", x === b)); info(); });
  ["sfPart", "sfQty"].forEach(id => m.$("#" + id).oninput = info);
  m.$("#sfPart").onchange = () => { m.$("#sfCost").value = ""; info(); };
  info();
  m.$("#sfSave").onclick = async () => {
    const r = await run(() => api("inventory_tx", { part_id: m.$("#sfPart").value, type, quantity: m.$("#sfQty").value, unit_cost: m.$("#sfCost").value || m.$("#sfCost").placeholder, reason: m.$("#sfReason").value }));
    toast(`재고 ${r.before} → ${r.after}`); m.close(); if (App.view === "inventory") refreshView();
  };
}

/* ---------- 서비스·가격 ---------- */
Views.services = {
  async render(el) {
    el.innerHTML = `<div class="page-head"><h2>서비스 · 가격</h2><button class="btn primary" onclick="openServiceForm()">+ 서비스 등록</button></div><div class="panel" id="svList"><div class="empty">불러오는 중...</div></div>`;
    try { App.services = await api("services"); if (!Inv.parts.length) Inv.parts = await api("parts", {}, { silent: true }); } catch (e) { return toast(e.message, true); }
    const cats = [...new Set(App.services.map(s => s.category || "기타"))];
    document.getElementById("svList").innerHTML = cats.map(c => `<div class="section-title" style="margin-top:4px">${esc(c)}</div>` + App.services.filter(s => (s.category || "기타") === c).map(s => `
      <div class="item" data-id="${esc(s.service_id)}"><div class="main-col"><div class="title">${esc(s.service_name)} ${s.active !== "Y" ? '<span class="pill">미사용</span>' : ""}</div>
        <div class="sub">${s.duration_min}분${s.discount_allowed === "Y" ? ` · 할인 최대 ${s.max_discount_rate}%` : " · 할인 불가"}${s.parts.length ? " · 기본부품: " + s.parts.map(p => esc((Inv.parts.find(x => x.part_id === p.part_id) || {}).part_name || p.part_id) + "×" + p.default_quantity).join(", ") : ""}</div></div>
        <div class="side-col b">${money(s.base_price)}<div class="xs faint">${esc(s.service_id)}</div></div></div>`).join("")).join("") || '<div class="empty">서비스가 없습니다.</div>';
    document.querySelectorAll("#svList [data-id]").forEach(x => x.onclick = () => openServiceForm(App.services.find(s => s.service_id === x.dataset.id)));
  }
};
async function openServiceForm(s, onSaved) {
  s = s || { parts: [] };
  if (!Inv.parts.length) { try { Inv.parts = await api("parts", {}, { silent: true }); } catch (e) {} }
  const sp = (s.parts || []).map(p => Object.assign({}, p));
  const m = openModal({
    title: s.service_id ? "서비스 수정" : "서비스 등록",
    body: `<div class="grid2"><label>서비스명 *<input id="svName" value="${esc(s.service_name)}"></label><label>분류<select id="svCat"><option>홈케어</option><option>설비</option><option>기타</option></select></label>
      <label>기본가격<input type="number" id="svPrice" value="${s.base_price || 0}" step="1000"></label><label>소요시간(분)<input type="number" id="svDur" value="${s.duration_min || 60}" step="30"></label>
      <label>할인 허용<select id="svDisc"><option value="Y">허용</option><option value="N">불가</option></select></label><label>최대 할인율(%)<input type="number" id="svRate" value="${s.max_discount_rate || 0}"></label>
      <label>사용<select id="svAct"><option value="Y">사용</option><option value="N">미사용</option></select></label><label class="span2">설명<input id="svDesc" value="${esc(s.description)}"></label></div>
      <div class="section-title">기본 사용 부품 <span class="xs muted" style="font-weight:400">(작업완료 때 자동으로 들어가요)</span></div>
      <div id="svParts"></div>
      <div class="row" style="margin-top:6px"><select id="svAddPart" class="grow" style="width:auto;flex:1"></select><button class="btn sm ghost" id="svNewPart">+ 신규 부품 등록</button></div>`,
    foot: `<button class="btn" data-x>취소</button><button class="btn primary" id="svSave">저장</button>`
  });
  m.$("#svCat").value = s.category || "홈케어"; m.$("#svDisc").value = s.discount_allowed || "Y"; m.$("#svAct").value = s.active || "Y";
  m.$("[data-x]").onclick = m.close;
  const draw = () => {
    m.$("#svParts").innerHTML = sp.map((p, i) => `<div class="line" style="grid-template-columns:1fr 70px 34px"><span>${esc((Inv.parts.find(x => x.part_id === p.part_id) || {}).part_name || p.part_id)}</span><input type="number" min="1" value="${p.default_quantity}" data-i="${i}"><button class="btn sm ghost" data-d="${i}">✕</button></div>`).join("") || '<div class="small muted">없음</div>';
    m.$$("#svParts input").forEach(x => x.oninput = () => sp[x.dataset.i].default_quantity = Math.max(1, num(x.value)));
    m.$$("#svParts [data-d]").forEach(x => x.onclick = () => { sp.splice(Number(x.dataset.d), 1); draw(); });
  };
  const partOptions = () => { m.$("#svAddPart").innerHTML = `<option value="">+ 부품 추가</option>${Inv.parts.filter(p => p.active !== "N").map(p => `<option value="${esc(p.part_id)}">${esc(p.part_name)} ${esc(p.model_spec)}</option>`).join("")}`; };
  partOptions();
  // [신규 부품 등록] 저장 후: 부품 목록 새로 받고, 이 서비스의 기본 사용 부품에 바로 추가
  m.$("#svNewPart").onclick = () => openPartForm({}, async saved => {
    try { Inv.parts = await api("parts", {}, { fresh: true, silent: true }); } catch (e) {}
    partOptions();
    if (saved.part_id && !sp.some(x => x.part_id === saved.part_id)) sp.push({ part_id: saved.part_id, default_quantity: 1 });
    draw();
  });
  m.$("#svAddPart").onchange = e => { const id = e.target.value; if (id && !sp.some(p => p.part_id === id)) sp.push({ part_id: id, default_quantity: 1 }); e.target.value = ""; draw(); };
  draw();
  m.$("#svSave").onclick = async () => {
    const saved = await run(() => api("service_save", { service_id: s.service_id || "", service_name: m.$("#svName").value, category: m.$("#svCat").value, base_price: m.$("#svPrice").value, duration_min: m.$("#svDur").value, discount_allowed: m.$("#svDisc").value, max_discount_rate: m.$("#svRate").value, active: m.$("#svAct").value, description: m.$("#svDesc").value, parts: sp }), "서비스를 저장했습니다.");
    m.close();
    if (onSaved) onSaved(saved || {}); else refreshView();
  };
}
</script>

<script>
/* ===== 설정 (최고관리자): 근무시간 / 계정 ===== */
const Set_ = { tab: "slots", week: "" };

Views.settings = {
  async render(el) {
    if (!isSuper()) { el.innerHTML = '<div class="panel empty">최고관리자만 사용할 수 있습니다.</div>'; return; }
    el.innerHTML = `<div class="page-head"><h2>설정</h2></div><div class="tabs"><button data-t="slots">근무시간</button><button data-t="admins">계정</button><button data-t="company">업체 정보</button><button data-t="blog">블로그 템플릿</button><button data-t="backup">데이터 백업</button></div><div id="setBody"></div>`;
    el.querySelectorAll(".tabs button").forEach(b => { b.classList.toggle("active", b.dataset.t === Set_.tab); b.onclick = () => { Set_.tab = b.dataset.t; Views.settings.render(el); }; });
    if (Set_.tab === "admins") return renderAdmins();
    if (Set_.tab === "company") return renderCompany();
    if (Set_.tab === "backup") return renderBackup();
    if (Set_.tab === "blog") return renderBlogTemplates();
    return renderSlots();
  }
};

function mondayOf(ds) { const p = ds.split("-").map(Number); const d = new Date(p[0], p[1] - 1, p[2]); return addDays(ds, -((d.getDay() + 6) % 7)); }

async function renderSlots() {
  if (!Set_.week) Set_.week = mondayOf(todayStr());
  const box = document.getElementById("setBody");
  box.innerHTML = `<div class="panel"><div class="panel-head"><h3>주간 근무표</h3><div class="row"><button class="btn sm" id="wkPrev">◀</button><b id="wkLabel"></b><button class="btn sm" id="wkNext">▶</button></div></div><div class="table-wrap" id="wkTable"></div>
      <div class="xs muted" style="margin-top:6px">규칙이 없는 요일은 기본 근무시간(08:00~20:00)입니다. 쉬는 날은 ‘종일 휴무’ 규칙을 추가하세요.</div></div>
    <div class="panel"><div class="panel-head"><h3>근무시간 규칙</h3><button class="btn primary sm" id="tsNew">+ 규칙 추가</button></div><div id="tsList"></div>
      <div class="xs muted" style="margin-top:6px">우선순위: 특정일(담당자) › 특정일(전체) › 요일(담당자) › 요일(전체) › 기본</div></div>`;
  document.getElementById("wkPrev").onclick = () => { Set_.week = addDays(Set_.week, -7); renderSlots(); };
  document.getElementById("wkNext").onclick = () => { Set_.week = addDays(Set_.week, 7); renderSlots(); };
  document.getElementById("tsNew").onclick = () => openSlotForm();
  const [wk, slots] = await Promise.all([api("work_week", { date: Set_.week }), api("time_slots")]);
  document.getElementById("wkLabel").textContent = `${dayLabel(wk.days[0])} ~ ${dayLabel(wk.days[6])}`;
  document.getElementById("wkTable").innerHTML = `<table class="tbl" style="min-width:640px"><thead><tr><th>담당자</th>${wk.days.map(d => `<th style="text-align:center;${d === todayStr() ? "background:#fffbeb" : ""}">${dayLabel(d)}</th>`).join("")}</tr></thead><tbody>${wk.rows.map(r => `<tr><td class="b"><span class="dot" style="background:${adminColor(r.assignee_id)}"></span>${esc(r.name)}</td>${r.days.map(d => d.off ? `<td style="text-align:center;background:#fef2f2;color:#dc2626" class="small">휴무</td>` : `<td style="text-align:center" class="small">${d.windows.map(esc).join("<br>")}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  Set_.slots = slots;
  document.getElementById("tsList").innerHTML = slots.length ? slots.sort((a, b) => (a.assignee_id || "").localeCompare(b.assignee_id || "")).map(s => {
    const type = s.bookable === "N" ? (s.start_time ? "예약불가" : "종일 휴무") : "근무";
    return `<div class="item" data-id="${esc(s.slot_id)}"><div class="main-col"><div class="row"><b>${esc(s.assignee_id ? adminName(s.assignee_id) : "전체 공통")}</b><span class="pill ${type === "근무" ? "ok" : type === "종일 휴무" ? "danger" : "warn"}">${type}</span></div><div class="sub">${/^\d{4}/.test(s.weekday) ? fullDayLabel(s.weekday) : esc(s.weekday)} ${s.start_time ? "· " + esc(s.start_time) + "~" + esc(s.end_time) : ""} ${s.memo ? "· " + esc(s.memo) : ""}</div></div><div class="side-col"><button class="btn sm danger" data-del="${esc(s.slot_id)}">삭제</button></div></div>`;
  }).join("") : '<div class="empty">규칙이 없습니다. 지금은 모두 매일 08:00~20:00 근무입니다.</div>';
  document.querySelectorAll("#tsList [data-id]").forEach(x => x.onclick = async e => {
    if (e.target.dataset.del) {
      e.stopPropagation();
      if (!(await confirmBox("이 규칙을 삭제할까요?", "삭제"))) return;
      await run(() => api("time_slot_delete", { slot_id: e.target.dataset.del }), "삭제했습니다."); return renderSlots();
    }
    openSlotForm(slots.find(s => s.slot_id === x.dataset.id));
  });
}

function openSlotForm(s) {
  s = s || {};
  const isDate = /^\d{4}/.test(s.weekday || "");
  const parseDays = t => { t = String(t || ""); if (t === "평일") return [1, 2, 3, 4, 5]; if (t === "주말") return [0, 6]; if (t === "매일" || t === "전체") return [0, 1, 2, 3, 4, 5, 6]; return t.split(/[,\s/]+/).map(x => WD.indexOf(x.charAt(0))).filter(i => i >= 0); };
  const days = s.weekday && !isDate ? parseDays(s.weekday) : [1, 2, 3, 4, 5];
  const type = !s.slot_id ? "work" : s.bookable === "N" ? (s.start_time ? "block" : "off") : "work";
  const m = openModal({
    title: s.slot_id ? "근무시간 규칙 수정" : "근무시간 규칙 추가",
    body: `<label>담당자<select id="sfA"><option value="">전체 공통</option>${adminOptions(s.assignee_id)}</select></label>
      <label>적용</label><div class="tabs" id="sfMode" style="margin-top:6px"><button data-m="week" class="${isDate ? "" : "active"}">요일 반복</button><button data-m="date" class="${isDate ? "active" : ""}">특정 날짜</button></div>
      <div id="sfWeek" ${isDate ? "hidden" : ""}><div class="row">${[1, 2, 3, 4, 5, 6, 0].map(d => `<label class="check btn sm ghost" style="margin:0"><input type="checkbox" value="${d}" ${days.includes(d) ? "checked" : ""}> ${WD[d]}</label>`).join("")}</div>
        <div class="quick" style="margin-top:6px"><button class="btn sm" data-q="1,2,3,4,5">평일</button><button class="btn sm" data-q="0,6">주말</button><button class="btn sm" data-q="0,1,2,3,4,5,6">매일</button></div></div>
      <div id="sfDate" ${isDate ? "" : "hidden"}><input type="date" id="sfDay" value="${isDate ? s.weekday : todayStr()}"></div>
      <label>구분<select id="sfType"><option value="work">근무시간 (예약 가능)</option><option value="block">예약불가 시간 (점심·외근)</option><option value="off">종일 휴무</option></select></label>
      <div class="grid2" id="sfTimes"><label>시작<select id="sfS">${timeOptions(s.start_time || "09:00", 360, 1380, 30)}</select></label><label>종료<select id="sfE">${timeOptions(s.end_time || "18:00", 360, 1410, 30)}</select></label></div>
      <label>메모<input id="sfMemo" value="${esc(s.memo)}" placeholder="예: 점심, 여름휴가"></label>`,
    foot: `<button class="btn" data-x>취소</button><button class="btn primary" id="sfSave">저장</button>`
  });
  m.$("[data-x]").onclick = m.close;
  m.$("#sfType").value = type;
  let mode = isDate ? "date" : "week";
  const sync = () => { m.$("#sfTimes").hidden = m.$("#sfType").value === "off"; m.$("#sfWeek").hidden = mode !== "week"; m.$("#sfDate").hidden = mode !== "date"; };
  m.$$("#sfMode button").forEach(b => b.onclick = () => { mode = b.dataset.m; m.$$("#sfMode button").forEach(x => x.classList.toggle("active", x === b)); sync(); });
  m.$$("[data-q]").forEach(b => b.onclick = () => { const q = b.dataset.q.split(",").map(Number); m.$$("#sfWeek input").forEach(c => c.checked = q.includes(Number(c.value))); });

/** 직인 이미지 → 작은 PNG (설정 칸 한 개에 들어가도록 45,000자 이하) */
function stampDataUrl(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      for (const size of [200, 160, 120, 90]) {
        const k = Math.min(1, size / Math.max(img.width, img.height));
        const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        const d = cv.toDataURL("image/png");
        if (d.length <= 45000) return resolve(d);
      }
      reject(new Error("이미지가 너무 복잡합니다. 도장 부분만 잘라서 다시 시도해주세요."));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이미지를 읽을 수 없습니다.")); };
    img.src = url;
  });
}

    <div class="row"><button class="btn primary" id="bkJson">전체 백업 (JSON 1개 파일)</button><button class="btn" id="bkCsv">시트별 CSV 내려받기</button></div>
    <div id="bkMsg" class="small muted" style="margin-top:10px"></div></div>`;
  const dl = (name, text, type) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: type }));
    a.target = "_self"; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  const stamp = () => todayStr().replace(/-/g, "");
  document.getElementById("bkJson").onclick = async () => {
    const d = await run(() => api("export_all"));
    dl(`backup_${stamp()}.json`, JSON.stringify(d), "application/json");
    document.getElementById("bkMsg").textContent = "백업 파일을 내려받았습니다: " + Object.keys(d.tables).map(k => k + " " + (d.tables[k].length - 1) + "건").join(", ");
  };
  document.getElementById("bkCsv").onclick = async () => {
    const d = await run(() => api("export_all"));
    const csvCell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    let i = 0;
    for (const name of Object.keys(d.tables)) {
      const csv = "\ufeff" + d.tables[name].map(r => r.map(csvCell).join(",")).join("\r\n");
      setTimeout(() => dl(`${name}_${stamp()}.csv`, csv, "text/csv;charset=utf-8"), 400 * i++);
    }
    document.getElementById("bkMsg").textContent = `CSV ${i}개를 내려받습니다. (브라우저가 '여러 파일 다운로드'를 물으면 허용)`;
  };
}

        <div class="xs faint">${esc(x.quote_id)} · 유효 ${esc(x.valid_until)}${x.valid_until && x.valid_until < todayStr() && ["작성", "발송"].includes(x.status) ? ' <span class="red">기한 지남</span>' : ""}</div>

/* --- 계산 (서버와 같은 규칙) --- */
function calcVat(sum, mode) {
  sum = Math.round(sum);
  if (mode === "별도") { const v = Math.floor(sum * 0.1); return { supply: sum, vat: v, total: sum + v }; }
  if (mode === "포함") { const s = Math.round(sum / 1.1); return { supply: s, vat: sum - s, total: sum }; }
  return { supply: sum, vat: 0, total: sum };
}
/** 1234000 → "일백이십삼만사천" */
function krAmount(n) {
  n = Math.round(Math.abs(n)); if (!n) return "영";
  const d = ["", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"], u = ["", "십", "백", "천"], big = ["", "만", "억", "조"];
  let s = "", i = 0;
  while (n > 0) {
    let k = n % 10000, c = "";
    for (let j = 0; j < 4; j++) { const x = k % 10; if (x) c = d[x] + u[j] + c; k = Math.floor(k / 10); }
    if (c) s = c + big[i] + s;
    n = Math.floor(n / 10000); i++;
  }
  return s;
}
function won(n) { return Math.round(num(n)).toLocaleString("ko-KR"); }

/** 견적서 → 예약 등록 화면 (서비스·금액 차이·메모 미리 채움) */
async function quoteToReservation(q) {
  const lines = (q.items || []).filter(i => i.service_id && App.services.some(s => s.service_id === i.service_id)).map(i => ({ service_id: i.service_id, qty: Math.max(1, Math.round(i.qty)) }));
  const svcSum = lines.reduce((a, l) => a + App.services.find(s => s.service_id === l.service_id).base_price * l.qty, 0);
  const diff = lines.length ? q.total_amount - svcSum : 0;
  const go2 = customer => openReservationForm({
    customer, lines,
    extra: diff > 0 ? diff : 0, extraReason: `견적 ${q.quote_id} 금액 반영`,
    discount: diff < 0 ? -diff : 0, discountReason: `견적 ${q.quote_id} 금액 반영`,
    memo: `견적서 ${q.quote_id}에서 전환 (견적 합계 ${money(q.total_amount)})`,
    onCreated: r => api("quote_status", { quote_id: q.quote_id, status: "예약전환", reservation_id: r.reservation_id })
  });
  if (!lines.length) toast("견적 품목 중 등록된 서비스가 없어요. 예약 화면에서 서비스를 골라주세요.");
  let customer = null;
  if (q.customer_id) { try { customer = (await loadCustomersCache()).find(c => c.customer_id === q.customer_id) || null; } catch (e) {} }
  if (customer) return go2(customer);
  // 등록되지 않은 고객이면 먼저 고객 등록
  toast("예약하려면 고객 등록이 필요합니다. 내용을 확인하고 저장하세요.");
  openCustomerForm({ name: q.customer_name, phone: q.customer_phone, address: q.customer_address }, async c => {
    const list = await loadCustomersCache(true);
    go2(list.find(x => x.customer_id === c.customer_id) || c);
  });
}

function downloadBlob(blob, name) {

/* --- PDF 만들기 ---
 * 1) 문서를 화면과 분리된 A4 폭(794px) 틀(iframe) 안에 그림 → 휴대폰·팝업창 영향 없이 항상 같은 모양
 * 2) html2canvas 로 사진처럼 찍음 (처음 누를 때만 인터넷에서 불러옴)
 * 3) PDF 파일은 직접 만듦 (A4, 길면 여러 장)
 */
const CANVAS_LIBS = ["https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"];
let canvasLibPromise = null;
function loadCanvasLib() {
  if (window.html2canvas) return Promise.resolve();
  if (canvasLibPromise) return canvasLibPromise;
  canvasLibPromise = CANVAS_LIBS.reduce((p, url) => p.catch(() => new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = url; s.onload = () => window.html2canvas ? res() : rej(); s.onerror = () => { s.remove(); rej(); };
    document.head.appendChild(s);
  })), Promise.reject()).catch(() => { canvasLibPromise = null; throw new Error("PDF 도구를 불러오지 못했습니다. [🖨 인쇄] → 'PDF로 저장'을 이용하세요."); });
  return canvasLibPromise;
}
async function renderDocCanvas(html) {
  await loadCanvasLib();
  const fr = document.createElement("iframe");
  fr.setAttribute("aria-hidden", "true");
  fr.style.cssText = "position:fixed;left:-12000px;top:0;width:794px;height:1123px;border:0;background:#fff";
  document.body.appendChild(fr);
  try {
    const d = fr.contentDocument;
    d.open();
    d.write(`<!DOCTYPE html><html><head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0768df">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="설비관리"><meta charset="UTF-8"><style>${document.getElementById("docStyle").textContent}</style></head><body style="margin:0;background:#fff">${html}</body></html>`);
    d.close();
    const page = d.body.firstElementChild;
    page.style.margin = "0"; page.style.boxShadow = "none";
    await Promise.all([...d.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    if (d.fonts && d.fonts.ready) { try { await d.fonts.ready; } catch (e) {} }
    const h = Math.ceil(page.getBoundingClientRect().height);
    fr.style.height = h + "px";
    return await window.html2canvas(page, { scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false, x: 0, y: 0, scrollX: 0, scrollY: 0, width: 794, height: h, windowWidth: 794, windowHeight: h });
  } finally { fr.remove(); }
}
/** 캔버스 → A4 PDF (JPEG 이미지, 길면 페이지 나눔) */
function canvasToPdf(canvas) {
  const W = 595.28, H = 841.89;                    // A4 (pt)
  const pagePx = Math.floor(canvas.width * H / W); // 한 장에 들어가는 높이(px)
  const pages = [];
  for (let y = 0; y < canvas.height; y += pagePx) {
    const sh = Math.min(pagePx, canvas.height - y);
    if (sh < 8 && y > 0) break;
    const c = document.createElement("canvas"); c.width = canvas.width; c.height = sh;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, sh); g.drawImage(canvas, 0, y, c.width, sh, 0, 0, c.width, sh);
    const b64 = c.toDataURL("image/jpeg", 0.92).split(",")[1], bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    pages.push({ w: c.width, h: sh, bytes, drawH: W * sh / c.width });
  }
  const enc = new TextEncoder(), parts = [], offsets = [];
  let pos = 0;
  const put = x => { const b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); pos += b.length; };
  const n = pages.length, kids = [];
  for (let i = 0; i < n; i++) kids.push((3 + i * 3) + " 0 R");
  put("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  offsets[1] = pos; put("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  offsets[2] = pos; put(`2 0 obj\n<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${n} >>\nendobj\n`);
  pages.forEach((p, i) => {
    const po = 3 + i * 3, co = po + 1, io = po + 2;
    const content = `q ${W.toFixed(2)} 0 0 ${p.drawH.toFixed(2)} 0 ${(H - p.drawH).toFixed(2)} cm /Im0 Do Q`;
    offsets[po] = pos; put(`${po} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${io} 0 R >> >> /Contents ${co} 0 R >>\nendobj\n`);
    offsets[co] = pos; put(`${co} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    offsets[io] = pos; put(`${io} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`); put(p.bytes); put("\nendstream\nendobj\n");
  });
  const total = 3 + n * 3, xref = pos;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
  put(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: "application/pdf" });
}
async function makePdf(html) { return canvasToPdf(await renderDocCanvas(html)); }
</script>

<script>
/* ===== 블로그 글 초안 (작업 전후 사진 → 네이버 블로그용 글) =====
 * 정해진 문장 틀을 섞어서 만듭니다. [다른 문장으로]를 누르면 표현이 바뀝니다.
 */
function blogPick(arr, seed, k) { return arr[Math.abs(seed + k * 7919) % arr.length]; }
function blogSeed(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function blogDate(ds) { const p = String(ds || "").split("-"); return p.length === 3 ? `${p[0]}.${p[1]}.${p[2]}` : ds; }
/** 받침에 따라 조사 선택: josa("청소","을","를") → "청소를" */
function josa(word, a, b) { const c = String(word || "").trim().slice(-1).charCodeAt(0); if (c < 0xAC00 || c > 0xD7A3) return word + a + "(" + b + ")"; const j = (c - 0xAC00) % 28; return word + (j && !(a === "으로" && j === 8) ? a : b); }
function dataUrlFile(dataUrl, name) {
  const m = String(dataUrl).match(/^data:([^;]+);base64,(.*)$/);
  const bin = atob(m[2]), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new File([u], name, { type: m[1] });
}
function blogTag(s) { return "#" + String(s).replace(/[^0-9A-Za-z가-힣]/g, ""); }

function buildBlog(d, seed) {
  const co = d.company.name, area = d.area.text || "", gu = d.area.gu || "", dong = d.area.dong || "";
  const svcNames = d.services.map(s => s.name);
  const main = svcNames[0] || "작업";
  const svc = svcNames.length > 1 ? `${main} 외 ${svcNames.length - 1}건` : main;
  const isCare = d.categories.includes("홈케어") && !d.categories.includes("설비");
  const before = d.photos.filter(p => p.photo_type === "작업전"), after = d.photos.filter(p => p.photo_type === "작업후"), etc = d.photos.filter(p => p.photo_type !== "작업전" && p.photo_type !== "작업후");
  const where = area ? area + " " : "";

  const title = blogPick([
    `${where}${svc} 후기 | ${co}`,
    `${where}${main} 작업, 전후 사진으로 보여드려요`,
    `[${gu || co}] ${svc} 깔끔하게 끝냈습니다`,
    `${where}${main} 시공 현장 이야기 – ${co}`
  ], seed, 1);

  const hello = blogPick([
    `안녕하세요, ${co}입니다 😊`,
    `안녕하세요! 꼼꼼한 ${isCare ? "홈케어" : "설비"} 전문 ${co}입니다.`,
    `반갑습니다, ${co}입니다 🙂`
  ], seed, 2);
  const intro = blogPick([
    `오늘은 ${where}고객님 댁에서 진행한 ${svc} 작업을 소개해 드릴게요.`,
    `${area ? area + "에서" : "이번에"} 맡겨 주신 ${svc} 현장을 사진과 함께 정리해 봤습니다.`,
    `이번 글에서는 ${where}${main} 작업 과정을 전후 사진으로 보여드리려고 해요.`

  const lines = [];
  lines.push(hello, intro, "");
  lines.push("■ 작업 정보");
  if (area) lines.push(`· 지역: ${area}`);
  lines.push(`· 작업: ${svcNames.map((n, i) => n + (d.services[i].qty > 1 ? ` ×${d.services[i].qty}` : "")).join(", ") || "-"}`);
  if (d.parts.length) lines.push(`· 사용 부품: ${d.parts.join(", ")}`);
  lines.push(`· 작업일: ${blogDate(d.date)}`, "");

  const photoBlock = (list, label) => list.forEach(p => { n++; lines.push(`[사진 ${n} – ${label}]`); if (p.memo) lines.push(p.memo); });

    "오래 사용하시면서 눈에 보이지 않는 곳까지 오염이 쌓인 상태였어요.",
    "겉으로는 괜찮아 보여도 가까이 보면 얼룩과 먼지가 꽤 많았습니다.",
    "생활하시면서 자연스럽게 쌓인 오염이 많이 보였어요."
  ] : [
    "사용하시면서 불편함이 있어 연락을 주셨어요.",
    "오래 사용해서 성능이 떨어지고 교체가 필요한 상태였습니다.",
    "현장을 확인해 보니 손을 봐야 할 부분이 분명히 보였어요."
  ], seed, 4), "");

  if (etc.length) { lines.push("■ 작업 과정"); photoBlock(etc, "작업 과정"); }
  else lines.push("■ 작업 과정");
  lines.push(blogPick(isCare ? [
    `전용 장비와 세제로 ${main} 작업을 꼼꼼하게 진행했습니다.`,
    `구석구석 놓치는 곳 없이 ${josa(main, "을", "를")} 진행했어요.`,
    `소재에 맞는 방법으로 ${main} 작업을 진행했습니다.`
  ] : [
    `기존 상태를 점검한 뒤 ${main} 작업을 진행했습니다.`,
    `현장에 맞게 꼼꼼하게 ${main} 작업을 진행했어요.`,
    `안전하게 물·전원을 차단하고 ${main} 작업을 진행했습니다.`
  ], seed, 5) + (d.parts.length ? ` 부품은 ${d.parts.length > 1 ? d.parts.join(", ") + " 등으로" : josa(d.parts[0], "으로", "로")} 교체했어요.` : ""), "");

  lines.push("■ 작업 후");
  photoBlock(after, "작업 후");
  lines.push(blogPick([
    "깔끔하게 마무리되었습니다 ✨ 고객님도 만족해 주셔서 뿌듯했어요.",
    "작업 전과 비교하면 확실히 달라진 모습이죠? 😊",
    "마무리 정리까지 깨끗하게 끝냈습니다. 감사합니다!"
  ], seed, 6), "");

  const outro = (d.company.blog_outro || "").trim();
  lines.push("────────────");
  lines.push(outro || blogPick([
    `${co}는 작은 작업도 내 집처럼 꼼꼼하게 진행합니다.`,
    `${gu ? gu + " 및 인근 지역 " : ""}${isCare ? "홈케어" : "설비"}가 필요하시면 편하게 문의 주세요.`,
    `궁금한 점은 언제든 편하게 연락 주세요. 친절하게 상담해 드립니다.`
  ], seed, 7));
  if (!outro && d.company.phone) lines.push(`📞 문의: ${d.company.phone}`);
  if (!outro && gu) lines.push(`📍 서비스 지역: ${gu} 및 인근`);
  lines.push("");

  lines.push(blogHashtags(d));

  return { title, body: lines.join("\n"), photoCount: n, ordered: [...before, ...etc, ...after] };
}

function blogIsCare(d) { return d.categories.includes("홈케어") && !d.categories.includes("설비"); }
function blogHashtags(d) {
  const gu = d.area.gu || "", dong = d.area.dong || "", isCare = blogIsCare(d), tags = [];
  const add = t => { const x = blogTag(t); if (x.length > 1 && !tags.includes(x)) tags.push(x); };
  d.services.map(s => s.name).forEach(s => { if (gu) add(gu.replace(/(구|군|시)$/, "") + s); if (dong) add(dong + s); add(s); });
  if (gu) add(gu + (isCare ? "홈케어" : "설비"));
  if (dong) add(dong + (isCare ? "청소" : "설비"));
  d.parts.slice(0, 2).forEach(add);
  add(d.company.name);
  String(d.company.blog_tags || "").split(/[\s,#]+/).filter(Boolean).forEach(add);
  return tags.slice(0, 20).join(" ");
}

function blogVarsOf(d, seed) {
  const svcNames = d.services.map(s => s.name), main = svcNames[0] || "작업";
  const co = d.company.name, gu = d.area.gu || "", isCare = blogIsCare(d);
  return {
    "업체명": co, "전화": d.company.phone || "", "지역": d.area.text || "", "구": gu, "동": d.area.dong || "",
    "대표서비스": main, "서비스": svcNames.length > 1 ? `${main} 외 ${svcNames.length - 1}건` : main,
    "작업목록": d.services.map(s => s.name + (s.qty > 1 ? ` ×${s.qty}` : "")).join(", "),
    "부품": d.parts.join(", "), "작업일": blogDate(d.date), "해시태그": blogHashtags(d),
    "인사": blogPick([`안녕하세요, ${co}입니다 😊`, `안녕하세요! 꼼꼼한 ${isCare ? "홈케어" : "설비"} 전문 ${co}입니다.`, `반갑습니다, ${co}입니다 🙂`], seed, 2),
    "마무리": (d.company.blog_outro || "").trim() || blogPick([`${co}는 작은 작업도 내 집처럼 꼼꼼하게 진행합니다.`, `${gu ? gu + " 및 인근 지역 " : ""}${isCare ? "홈케어" : "설비"}가 필요하시면 편하게 문의 주세요.`, "궁금한 점은 언제든 편하게 연락 주세요. 친절하게 상담해 드립니다."], seed, 7)
  };
}
function renderBlogTemplate(tpl, d, seed) {
  const v = blogVarsOf(d, seed);
  const groups = { "작업전사진": d.photos.filter(p => p.photo_type === "작업전"), "작업후사진": d.photos.filter(p => p.photo_type === "작업후"), "작업과정사진": d.photos.filter(p => p.photo_type !== "작업전" && p.photo_type !== "작업후") };
  const label = { "작업전사진": "작업 전", "작업후사진": "작업 후", "작업과정사진": "작업 과정" };
  const ordered = [];
  const fillLine = line => {
    let empty = false;
    const out = line.replace(/\{([가-힣]+)\}/g, (all, k) => {
      if (groups[k]) {
        if (!groups[k].length) { empty = true; return ""; }
        return groups[k].map(p => { ordered.push(p); return `[사진 ${ordered.length} – ${label[k]}]` + (p.memo ? "\n" + p.memo : ""); }).join("\n");
      }
      if (!(k in v)) return all;            // 모르는 이름은 그대로 둠
      if (!v[k]) empty = true;
      return v[k];
    });
    return empty && /\{[가-힣]+\}/.test(line) ? null : out;
  };
  // 사진이 없어 빠진 줄 바로 위가 "■ 제목" 줄이면 그 제목도 함께 뺌
  const outLines = [];
  String(tpl.body || "").split("\n").forEach(line => {
    const r = fillLine(line);
    if (r !== null) { outLines.push(r); return; }
    if (/\{(작업전사진|작업후사진|작업과정사진)\}/.test(line) && outLines.length && /^\s*■/.test(outLines[outLines.length - 1])) outLines.pop();
  });
  const body = outLines.join("\n").replace(/\n{3,}/g, "\n\n");
  const title = (fillLine(tpl.title || "") || "").replace(/\s{2,}/g, " ").trim();
  return { title, body, ordered };
}

async function openBlogDraft(reservationId) {
  let d;
  try { d = await api("blog_draft", { reservation_id: reservationId }); } catch (e) { return toast(e.message, true); }
  let seed = blogSeed(reservationId);
  const m = openModal({
    title: "📝 블로그 글 만들기", wide: true,
    body: `
      ${!d.photos.length ? `<div class="box small" style="margin-bottom:8px">⚠️ 이 예약에 작업 사진이 없습니다. 작업 전·후 사진을 먼저 올리면 더 좋은 글이 됩니다.</div>` : ""}
      <div class="xs muted" style="margin-bottom:8px">① 제목·본문 복사 → ② 사진 저장(또는 보내기) → ③ 네이버 블로그 앱에서 붙여넣고 <b>[사진 1]</b> 자리에 순서대로 사진 넣기</div>
      <div class="row" style="flex-wrap:wrap;margin-bottom:4px"><span class="small b">글 틀</span><select id="bgTpl" style="width:auto;min-width:180px"><option value="">자동 문장 (기본)</option>${(d.templates || []).map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")}</select>${isSuper() ? `<button class="btn sm ghost" id="bgTplManage">✏️ 템플릿 관리</button>` : ""}</div>
      <label>제목<div class="row"><input id="bgTitle" class="grow"><button class="btn sm" id="bgCopyTitle">복사</button></div></label>
      <label>본문 (직접 고쳐도 됩니다)<textarea id="bgBody" rows="16" style="font-size:14px;line-height:1.55"></textarea></label>
      <div class="row" style="margin-top:6px;flex-wrap:wrap"><button class="btn primary" id="bgCopyBody">본문 복사</button><button class="btn" id="bgAgain">🔄 다른 문장으로</button><span class="xs muted">고객 이름·연락처·상세주소는 넣지 않았습니다.</span></div>
      <div class="section-title">사진 ${d.photos.length}장 <span class="xs muted">(글에 들어갈 순서)</span></div>
      <div class="photos" id="bgPhotos"></div>
      <div class="row" style="margin-top:8px;flex-wrap:wrap">
        ${d.photos.length ? `<button class="btn" id="bgSave">⬇ 사진 저장</button><button class="btn" id="bgShare">📤 사진 보내기 (블로그 앱 등)</button>` : ""}
        <span class="xs muted" id="bgMsg"></span>
      </div>`,
    foot: `<button class="btn" data-x>닫기</button>`
  });
  m.$("[data-x]").onclick = m.close;
  let cur;
  const tplSel = m.$("#bgTpl");
  let saved = ""; try { saved = localStorage.getItem("blog_tpl") || ""; } catch (e) {}
  const pickId = [saved, d.default_template].find(id => id && (d.templates || []).some(t => t.id === id)) || "";
  tplSel.value = pickId;
  const fill = () => {
    const tpl = (d.templates || []).find(t => t.id === tplSel.value);
    cur = tpl ? renderBlogTemplate(tpl, d, seed) : buildBlog(d, seed);
    m.$("#bgTitle").value = cur.title; m.$("#bgBody").value = cur.body;
    m.$("#bgPhotos").innerHTML = cur.ordered.map((p, i) => `<div class="photo">${p.thumb ? `<img src="${p.thumb}" alt="">` : ""}<span class="tag">${i + 1} · ${esc(p.photo_type)}</span></div>`).join("") || '<div class="small muted">사진 없음</div>';
  };
  fill();
  tplSel.onchange = () => { try { localStorage.setItem("blog_tpl", tplSel.value); } catch (e) {} fill(); };
  const mg = m.$("#bgTplManage"); if (mg) mg.onclick = () => { m.close(); Set_.tab = "blog"; go("settings"); };
  const copy = async (text, okMsg, ta) => {
    try { await navigator.clipboard.writeText(text); toast(okMsg); }
    catch (e) { if (ta) { ta.focus(); ta.select(); } try { document.execCommand("copy"); toast(okMsg); } catch (e2) { toast("길게 눌러 직접 복사해주세요.", true); } }
  };
  m.$("#bgCopyTitle").onclick = () => copy(m.$("#bgTitle").value, "제목을 복사했습니다.", m.$("#bgTitle"));
  m.$("#bgCopyBody").onclick = () => copy(m.$("#bgBody").value, "본문을 복사했습니다. 블로그 앱에 붙여 넣으세요.", m.$("#bgBody"));
  m.$("#bgAgain").onclick = () => { seed += 1; fill(); };
  const msg = m.$("#bgMsg");
  async function photoFiles() {
    const out = [];
    for (let i = 0; i < cur.ordered.length; i++) {
      const p = cur.ordered[i];
      msg.textContent = `사진 준비 중... (${i + 1}/${cur.ordered.length})`;
      const g = await api("photo_get", { photo_id: p.photo_id }, { silent: true });
      out.push(dataUrlFile(g.data, `${String(i + 1).padStart(2, "0")}_${p.photo_type === "작업전" ? "before" : p.photo_type === "작업후" ? "after" : "work"}.jpg`));
    }
    msg.textContent = "";
    return out;
  }
  const save = m.$("#bgSave");
  if (save) save.onclick = async () => {
    save.disabled = true;
    try { const files = await photoFiles(); files.forEach((f, i) => setTimeout(() => downloadBlob(f, f.name), i * 400)); msg.textContent = `${files.length}장을 내려받습니다. (브라우저가 '여러 파일 다운로드'를 물으면 허용)`; }
    catch (e) { msg.textContent = ""; toast(e.message, true); }
    finally { save.disabled = false; }
  };
  const share = m.$("#bgShare");
  if (share) share.onclick = async () => {
    share.disabled = true;
    try {
      const files = await photoFiles();
      if (navigator.canShare && navigator.canShare({ files })) {
        try { await navigator.share({ files }); } catch (e) { if (!e || e.name !== "AbortError") throw e; }
      } else { files.forEach((f, i) => setTimeout(() => downloadBlob(f, f.name), i * 400)); msg.textContent = "이 화면에선 바로 보내기가 안 돼서 사진을 내려받았어요."; }
    } catch (e) { msg.textContent = ""; toast(e.message || "보내기에 실패했습니다.", true); }
    finally { share.disabled = false; }
  };
}

  company: { name: "", phone: "", blog_outro: "", blog_tags: "" }

async function renderBlogTemplates() {
  const box = document.getElementById("setBody");
  let data;
  try { data = await api("blog_templates"); } catch (e) { box.innerHTML = `<div class="panel empty">${esc(e.message)}</div>`; return; }
  const list = data.templates || [];
  let def = data.default_template || "";
  const save = async (msg) => {
    const r = await run(() => api("blog_templates_save", { templates: list, default_template: def }), msg);
    list.splice(0, list.length, ...r.templates); def = r.default_template; draw();
  };
  const draw = () => {
    box.innerHTML = `<div class="panel"><div class="panel-head"><h3>블로그 템플릿</h3><button class="btn primary" id="btNew">+ 새 템플릿</button></div>
      <p class="small muted">블로그 글 만들기에서 고를 수 있는 나만의 글 틀입니다. <b>{업체명}</b>, <b>{작업전사진}</b> 처럼 중괄호 자리에 실제 내용이 들어갑니다.</p>
      ${list.length ? list.map((t, i) => `<div class="item" style="cursor:default"><div class="main-col"><div class="row"><b>${esc(t.name)}</b>${t.id === def ? '<span class="pill ok">기본</span>' : ""}</div><div class="sub">${esc(t.title || "(제목 틀 없음)")}</div><div class="xs faint">${esc(t.body.split("\n").filter(Boolean).slice(0, 2).join(" / "))}</div></div>
        <div class="side-col row" style="justify-content:flex-end;flex-wrap:wrap">${t.id !== def ? `<button class="btn sm" data-def="${i}">기본으로</button>` : `<button class="btn sm" data-undef="1">기본 해제</button>`}<button class="btn sm" data-edit="${i}">수정</button><button class="btn sm" data-copy="${i}">복사</button><button class="btn sm danger" data-del="${i}">삭제</button></div></div>`).join("")
        : `<div class="empty">저장된 템플릿이 없습니다.<br><button class="btn" id="btSample" style="margin-top:10px">기본 틀로 시작하기</button></div>`}
    </div>`;
    const on = (sel, fn) => box.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
    const nb = document.getElementById("btNew"); nb.onclick = () => openBlogTemplateForm(null, t => { list.push(t); save("템플릿을 저장했습니다."); });
    const sb = document.getElementById("btSample"); if (sb) sb.onclick = () => openBlogTemplateForm(Object.assign({}, BLOG_SAMPLE), t => { list.push(t); if (!def) def = t.id; save("템플릿을 저장했습니다."); });
    on("[data-edit]", b => { const i = Number(b.dataset.edit); openBlogTemplateForm(list[i], t => { list[i] = t; save("템플릿을 저장했습니다."); }); });
    on("[data-copy]", b => { const t = list[Number(b.dataset.copy)]; openBlogTemplateForm({ name: t.name + " (복사)", title: t.title, body: t.body }, n => { list.push(n); save("템플릿을 저장했습니다."); }); });
    on("[data-def]", b => { def = list[Number(b.dataset.def)].id; save("기본 템플릿으로 정했습니다."); });
    on("[data-undef]", () => { def = ""; save("기본 템플릿을 해제했습니다. (자동 문장이 기본)"); });
    on("[data-del]", async b => { const i = Number(b.dataset.del); if (!(await confirmBox(`'${list[i].name}' 템플릿을 삭제할까요?`, "삭제"))) return; if (list[i].id === def) def = ""; list.splice(i, 1); save("삭제했습니다."); });
  };
  draw();
}
function openBlogTemplateForm(t, onSave) {

  const m = openModal({
    title: t.id ? "템플릿 수정" : "새 템플릿", wide: true, sticky: true,
    body: `
      <label>템플릿 이름 *<input id="tfName" value="${esc(t.name)}" placeholder="예: 수전 교체 후기용"></label>
      <label>제목 틀<input id="tfTitle" value="${esc(t.title)}" placeholder="예: {지역} {서비스} 후기 | {업체명}"></label>

      <div class="xs muted" style="margin:8px 0 4px">눌러서 넣기 (커서 위치에 들어갑니다)</div>
      <div class="row" style="flex-wrap:wrap;gap:6px">${BLOG_TOKENS.map(([k, d]) => `<button class="btn sm" data-tok="${k}" title="${esc(d)}">{${k}}</button>`).join("")}</div>
      <div class="xs muted" style="margin-top:6px">· 내용이 비는 줄은 자동으로 빠집니다 (예: 부품을 안 쓴 작업의 "사용 부품: {부품}" 줄)<br>· 사진 자리에는 [사진 1 – 작업 전] 처럼 번호가 붙고, 사진 메모가 있으면 아래 줄에 들어갑니다</div>
      <div class="section-title">미리보기 <span class="xs muted">(예시 내용)</span></div>
      <div class="box small" id="tfPrev" style="white-space:pre-wrap;max-height:260px;overflow:auto"></div>
      <div class="form-msg" id="tfMsg" style="text-align:left"></div>`,
    foot: `<button class="btn" data-x>취소</button>${!t.body ? `<button class="btn" id="tfSample">기본 틀 불러오기</button>` : ""}<button class="btn primary" id="tfSave">저장</button>`
  });
  const $ = id => m.querySelector("#" + id);
  m.$("[data-x]").onclick = m.close;
  let last = $("tfBody");
  [$("tfTitle"), $("tfBody")].forEach(el => el.addEventListener("focus", () => last = el));
  const demo = () => Object.assign({}, BLOG_DEMO, { company: { name: App.company || "우리업체", phone: "010-0000-0000", blog_outro: "", blog_tags: "" } });
  const prev = () => { const r = renderBlogTemplate({ title: $("tfTitle").value, body: $("tfBody").value }, demo(), 1); $("tfPrev").textContent = (r.title ? "[제목] " + r.title + "\n\n" : "") + r.body; };
  ["tfTitle", "tfBody"].forEach(id => $(id).addEventListener("input", prev));
  m.$$("[data-tok]").forEach(b => b.onclick = () => {
    const el = last, tok = "{" + b.dataset.tok + "}", s0 = el.selectionStart ?? el.value.length, s1 = el.selectionEnd ?? s0;
    el.value = el.value.slice(0, s0) + tok + el.value.slice(s1); el.focus(); el.selectionStart = el.selectionEnd = s0 + tok.length; prev();
  });
  const sp = $("tfSample"); if (sp) sp.onclick = () => { if (!$("tfName").value) $("tfName").value = BLOG_SAMPLE.name; $("tfTitle").value = BLOG_SAMPLE.title; $("tfBody").value = BLOG_SAMPLE.body; prev(); };
  $("tfSave").onclick = () => {
    const name = $("tfName").value.trim(), body = $("tfBody").value;
    if (!name) return $("tfMsg").textContent = "템플릿 이름을 입력해주세요.";
    if (!body.trim()) return $("tfMsg").textContent = "본문 틀을 입력해주세요.";
    m.close(); onSave({ id: t.id || ("T" + Date.now().toString(36)), name, title: $("tfTitle").value.trim(), body });
  };
  prev();
}
