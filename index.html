<script>window.BOOT = null;</script>
<script>
/* ===== 공통: 상태 / 서버호출 / 화면전환 / 유틸 ===== */
const App = { token: "", me: null, admins: [], services: [], today: "", view: "", company: "", slot: 30 };
const COLORS = ["#2563eb", "#16a34a", "#d97706", "#db2777", "#7c3aed", "#0891b2", "#65a30d", "#dc2626"];
const NAV = [
  { v: "dashboard", t: "대시보드", i: "📊" },
  { v: "myday", t: "내 일정", i: "🧰" },
  { v: "reservations", t: "예약", i: "📅" },
  { v: "customers", t: "고객", i: "👤" },
  { v: "quotes", t: "견적서", i: "📝" },
  { v: "sales", t: "매출·미수금", i: "💰" },
  { v: "inventory", t: "부품·재고", i: "📦" },
  { v: "services", t: "서비스·가격", i: "🧹" },
  { v: "stats", t: "통계", i: "📈" },
  { v: "settings", t: "설정", i: "⚙️", superOnly: true }
];
const Views = {}; // 각 화면: Views.name = { render(container, params) }

/* --- 서버 호출 ---
 * 구글 Apps Script 안에서 열면 google.script.run 으로,
 * 다른 호스팅(내 도메인)에 올린 화면이면 API_BASE 주소로 POST 합니다.
 * → 나중에 서버를 옮겨도 API_BASE 한 줄만 바꾸면 화면은 그대로 사용.
 */
const API_BASE = window.API_BASE || ""; // 예: "https://script.google.com/macros/s/xxxx/exec" 또는 "https://내도메인/api"
let busyCount = 0;
function setBusy(on) { busyCount = Math.max(0, busyCount + (on ? 1 : -1)); document.getElementById("busy").hidden = busyCount === 0; }
function callServer(action, payload, token) {
  if (window.google && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve)
        .withFailureHandler(err => reject(new Error((err && err.message) || "서버 연결 오류")))
        .api(action, payload, token);
    });
  }
  if (!API_BASE) return Promise.reject(new Error("서버 주소(API_BASE)가 설정되지 않았습니다."));
  return fetch(API_BASE, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: action, payload: payload, token: token, company: window.COMPANY_CODE }) })
    .then(r => r.json(), () => { throw new Error("서버에 연결할 수 없습니다."); });
}
/* --- [속도] 화면 데이터 임시 보관 ---
 * 조회 결과를 잠깐(보통 60초) 기억해서 화면을 오갈 때 서버를 다시 부르지 않습니다.
 * 저장·수정·삭제를 하면 즉시 전부 비워서 항상 최신 내용을 보여줍니다.
 */
const READ_TTL = { dashboard: 60, schedule: 45, my_day: 60, reservations: 60, reservation_get: 60, customers: 90, customer_get: 60, services: 120, parts: 90, inventory_history: 60, sales: 60, receivables: 60, stats: 180, expenses: 60, time_slots: 120, work_week: 60, photo_list: 120, photo_get: 1800, quotes: 60, quote_get: 60, invoice_data: 30, admin_list: 60, company_get: 120 };
const NO_CLEAR = ["login", "logout", "public_info", "bootstrap"];
const ApiCache = new Map(), ApiInflight = new Map();
function sortObj(o) { if (Array.isArray(o)) return o.map(sortObj); if (o && typeof o === "object") { const r = {}; Object.keys(o).sort().forEach(k => r[k] = sortObj(o[k])); return r; } return o; }
function apiKey(action, payload) { return action + "|" + JSON.stringify(sortObj(payload || {})); }
function clearApiCache() { ApiCache.clear(); }
function cloneData(d) { try { return typeof structuredClone === "function" ? structuredClone(d) : JSON.parse(JSON.stringify(d)); } catch (e) { return d; } }
function api(action, payload, opts) {
  opts = opts || {};
  const ttl = READ_TTL[action];
  if (ttl) {
    const key = apiKey(action, payload);
    const hit = ApiCache.get(key);
    if (hit && !opts.fresh && Date.now() - hit.t < ttl * 1000) return Promise.resolve(cloneData(hit.data));
    if (ApiInflight.has(key)) return ApiInflight.get(key).then(cloneData);
    const pr = apiCall(action, payload, opts).then(d => { ApiCache.set(key, { t: Date.now(), data: d }); return d; });
    ApiInflight.set(key, pr);
    const done = () => ApiInflight.delete(key);
    pr.then(done, done);
    return pr.then(cloneData);
  }
  const p = apiCall(action, payload, opts);
  if (!NO_CLEAR.includes(action)) { const clr = () => clearApiCache(); p.then(clr, clr); }
  return p;
}
function apiCall(action, payload, opts) {
  if (!opts.silent) setBusy(true);
  return callServer(action, payload || {}, App.token).then(r => {
    if (!opts.silent) setBusy(false);
    if (!r) throw new Error("서버 응답이 없습니다.");
    if (!r.ok) {
      if (r.code === "AUTH" && action !== "login") { localLogout(); toast(r.error, true); }
      const e = new Error(r.error); e.code = r.code; throw e;
    }
    return r.data;
  }, err => { if (!opts.silent) setBusy(false); throw err; });
}
async function run(promiseFn, okMsg) {
  try { const r = await promiseFn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, true); throw e; }
}

/* --- 저장소 (실패해도 동작) --- */
const Store = {
  get(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v, remember) { try { (remember ? localStorage : sessionStorage).setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} }
};

/* --- 로그인 --- */
async function doLogin() {
  const btn = document.getElementById("loginBtn"), msg = document.getElementById("loginMsg");
  msg.textContent = ""; btn.disabled = true; btn.textContent = "로그인 중...";
  try {
    const r = await api("login", { login_id: val("loginId"), password: val("loginPw") });
    App.token = r.token;
    Store.del(("bc_token_" + window.COMPANY_CODE));
    Store.set(("bc_token_" + window.COMPANY_CODE), r.token, document.getElementById("loginRemember").checked);
    document.getElementById("loginPw").value = "";
    await startApp();
  } catch (e) { msg.textContent = e.message; }
  finally { btn.disabled = false; btn.textContent = "로그인"; }
}
async function doLogout() {
  try { await api("logout", {}, { silent: true }); } catch (e) {}
  localLogout();
}
function localLogout() {
  App.token = ""; App.me = null; Store.del(("bc_token_" + window.COMPANY_CODE)); clearApiCache();
  closeAllModals();
  document.getElementById("appView").hidden = true;
  document.getElementById("loginView").hidden = false;
}
function applyBrand(name, color) {
  if (name) { App.company = name; document.title = name + " 관리"; const l = document.getElementById("loginLogo"); if (l) l.textContent = name; const b = document.getElementById("brandName"); if (b) b.textContent = name; }
  if (color && /^#[0-9a-fA-F]{6}$/.test(color)) document.documentElement.style.setProperty("--primary", color);
}
async function doInitialSetup() {
  const msg = document.getElementById("isMsg"), btn = document.getElementById("isBtn");
  if (val("isPw") !== val("isPw2")) { msg.textContent = "비밀번호 확인이 다릅니다."; return; }
  btn.disabled = true; msg.textContent = "";
  try {
    const r = await api("initial_setup", { company_name: val("isCompany"), company_phone: val("isPhone"), admin_name: val("isName"), login_id: val("isLogin"), password: val("isPw"), sample_services: document.getElementById("isSample").checked });
    App.token = r.token; Store.set(("bc_token_" + window.COMPANY_CODE), r.token, true);
    document.getElementById("setupView").hidden = true;
    await startApp();
    toast("설정이 끝났습니다. 설정 메뉴에서 직원 계정과 근무시간을 추가하세요.");
  } catch (e) { msg.textContent = e.message; }
  finally { btn.disabled = false; }
}
/** 첫 화면 정하기 (주소 #화면 → 없으면 휴대폰 직원은 내 일정, 나머지는 대시보드) */
function firstView(role) {
  const hash = (Nav.startHash || location.hash).replace("#", "");
  if (NAV.some(n => n.v === hash) && (hash !== "settings" || role === "SUPER_ADMIN")) return hash;
  return window.innerWidth < 860 && role !== "SUPER_ADMIN" ? "myday" : "dashboard";
}
async function startApp() {
  // [속도] 기본 데이터 + 첫 화면 데이터를 한 번에 받음 (서버 왕복 1회 절약)
  const guess = firstView(Store.get("bc_role") || "");
  const t = todayStr();
  const first = guess === "dashboard" ? { action: "dashboard", payload: { month: t.slice(0, 7), date: t } } : guess === "myday" ? { action: "my_day", payload: { date: t, assignee_id: "" } } : null;
  const b = await api("bootstrap", { first });
  if (b.first && b.first.data) ApiCache.set(apiKey(b.first.action, b.first.payload), { t: Date.now(), data: b.first.data });
  Store.set("bc_role", b.me.role, true);
  App.me = b.me; App.admins = b.admins; App.services = b.services; App.today = b.today; App.company = b.company; App.slot = b.slot_minutes || 30; App.quoteVat = b.quote_vat || "포함"; App.quoteValidDays = b.quote_valid_days || 30; App.allowPast = !!b.allow_past;
  applyBrand(b.company, b.brand_color);
  document.getElementById("meName").textContent = App.me.name + (isSuper() ? " · 최고관리자" : "");
  document.getElementById("loginView").hidden = true;
  document.getElementById("appView").hidden = false;
  renderNav();
  App.view = "";
  const fv = firstView(App.me.role);
  Nav.replace(fv);
  go(fv, null, true);
}
function isSuper() { return App.me && App.me.role === "SUPER_ADMIN"; }

/* --- 뒤로가기(방문기록) 처리 ---
 * 화면을 index.html 하나에서 div 전환으로 바꾸기 때문에, 그대로 두면 브라우저 기록이 쌓이지 않아
 * 뒤로가기를 누르면 앱 밖으로 나가 버림. 화면 전환 때마다 기록을 남기고, 뒤로가기 시 이전 화면으로 복원.
 * Apps Script 웹앱(iframe 안)에서는 google.script.history, 그 밖(로컬 테스트·향후 앱 웹뷰)에서는 window.history 사용. */
const Nav = {
  startHash: "",
  gs() { return typeof google !== "undefined" && google.script && google.script.history ? google.script.history : null; },
  state(view, params) { let p = null; try { p = params ? JSON.parse(JSON.stringify(params)) : null; } catch (e) {} return { view: view, params: p }; },
  push(view, params) {
    const st = this.state(view, params), g = this.gs();
    try { if (g) g.push(st, null, view); else history.pushState(st, "", "#" + view); } catch (e) {}
  },
  replace(view) {
    const st = this.state(view), g = this.gs();
    try { if (g) g.replace(st, null, view); else history.replaceState(st, "", "#" + view); } catch (e) {}
  },
  onBack(st) {
    if (document.getElementById("appView").hidden || !App.me) return;   // 로그인 전에는 무시
    // 창(모달)이 열려 있으면 화면 이동 대신 창만 닫고, 현재 화면 기록을 다시 쌓아 둠
    if (document.querySelector(".modal-back")) { closeAllModals(); this.push(App.view); return; }
    const view = st && st.view;
    if (!view || !Views[view] || (view === "settings" && !isSuper())) return;
    go(view, st.params || {}, true);
  },
  init() {
    const g = this.gs();
    if (g) {
      g.setChangeHandler(e => this.onBack(e.state));
      try { google.script.url.getLocation(loc => { this.startHash = loc && loc.hash ? loc.hash : ""; }); } catch (e) {}
    } else {
      window.addEventListener("popstate", e => this.onBack(e.state));
    }
  }
};
Nav.init();

/* --- 화면 전환 --- */
function renderNav() {
  document.getElementById("nav").innerHTML = NAV.filter(n => !n.superOnly || isSuper())
    .map(n => `<button data-v="${n.v}" onclick="go('${n.v}')"><span>${n.i}</span><span>${n.t}</span><span class="badge" id="navBadge_${n.v}" hidden></span></button>`).join("");
}
function setNavBadge(view, count) {
  const el = document.getElementById("navBadge_" + view);
  if (!el) return;
  el.hidden = !count; el.textContent = count;
}
function go(view, params, fromHistory) {
  // [뒤로가기] 메뉴로 다른 화면에 갈 때만 방문기록을 쌓음 (뒤로가기로 온 경우·같은 화면 새로고침은 제외)
  if (!fromHistory && App.view && App.view !== view) Nav.push(view, params);
  App.view = view;
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("active", s.dataset.view === view));
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.v === view));
  const btn = document.querySelector(`#nav button[data-v="${view}"]`);
  if (btn && window.innerWidth < 860) btn.scrollIntoView({ inline: "center", block: "nearest" });
  window.scrollTo(0, 0);
  const el = document.querySelector(`.view[data-view="${view}"]`);
  if (Views[view]) Views[view].render(el, params || {});
}
function refreshView(force) { if (force) clearApiCache(); if (App.view) go(App.view); }

/* --- 모달 --- */
function openModal(opts) {
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML = `<div class="modal ${opts.wide ? "wide" : ""}" role="dialog">
    <div class="modal-head"><h3>${opts.title || ""}</h3><button class="btn sm ghost" data-close>닫기</button></div>
    <div class="modal-body">${opts.body || ""}</div>
    ${opts.foot ? `<div class="modal-foot">${opts.foot}</div>` : ""}</div>`;
  back.addEventListener("click", e => { if (e.target === back && !opts.sticky) closeModal(back); });
  back.querySelector("[data-close]").onclick = () => closeModal(back);
  document.getElementById("modalRoot").appendChild(back);
  document.body.style.overflow = "hidden";
  back.close = () => closeModal(back);
  back.$ = sel => back.querySelector(sel);
  back.$$ = sel => [...back.querySelectorAll(sel)];
  return back;
}
function closeModal(m) { if (m && m.parentNode) m.parentNode.removeChild(m); if (!document.querySelector(".modal-back")) document.body.style.overflow = ""; }
function closeAllModals() { document.querySelectorAll(".modal-back").forEach(closeModal); }
function confirmBox(message, okText) {
  return new Promise(res => {
    const m = openModal({ title: "확인", body: `<div style="white-space:pre-line">${esc(message)}</div>`, foot: `<button class="btn" data-no>취소</button><button class="btn primary" data-yes>${okText || "확인"}</button>` });
    m.$("[data-no]").onclick = () => { m.close(); res(false); };
    m.$("[data-yes]").onclick = () => { m.close(); res(true); };
  });
}

function promptBox(message, placeholder) {
  return new Promise(res => {
    const m = openModal({ title: "입력", body: `<div>${esc(message)}</div><input id="pbInput" style="margin-top:10px" placeholder="${esc(placeholder || "")}">`, foot: `<button class="btn" data-no>취소</button><button class="btn primary" data-yes>확인</button>` });
    m.$("[data-no]").onclick = () => { m.close(); res(null); };
    m.$("[data-yes]").onclick = () => { const v = m.$("#pbInput").value; m.close(); res(v); };
    setTimeout(() => m.$("#pbInput").focus(), 50);
  });
}

/* --- 토스트 --- */
let toastTimer;
function toast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, err ? 4500 : 2500);
}

/* --- 유틸 --- */
function esc(v) { return v === null || v === undefined ? "" : String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ""; }
function num(v) { return Number(String(v ?? 0).replace(/[^0-9.\-]/g, "")) || 0; }
function money(v) { return Math.round(num(v)).toLocaleString("ko-KR") + "원"; }
function pad(n) { return String(n).padStart(2, "0"); }
function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function todayStr() { return ymd(new Date()); }
function addDays(ds, n) { const p = ds.split("-").map(Number); return ymd(new Date(p[0], p[1] - 1, p[2] + n)); }
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function dayLabel(ds) { if (!ds) return ""; const p = ds.split("-").map(Number); const d = new Date(p[0], p[1] - 1, p[2]); return `${p[1]}/${p[2]} (${WD[d.getDay()]})`; }
function fullDayLabel(ds) { if (!ds) return ""; const p = ds.split("-").map(Number); const d = new Date(p[0], p[1] - 1, p[2]); return `${p[0]}년 ${p[1]}월 ${p[2]}일 (${WD[d.getDay()]})`; }
function toMin(t) { const m = String(t || "").match(/(\d{1,2}):(\d{2})/); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }
function hhmm(m) { return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
function nowMinutes() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function daysAgo(ds) { if (!ds) return 0; const p = ds.slice(0, 10).split("-").map(Number); const t = new Date(); return Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - new Date(p[0], p[1] - 1, p[2])) / 86400000); }
function admin(id) { return App.admins.find(a => a.admin_id === id) || { admin_id: id, name: id || "-", color: "" }; }
function adminName(id) { return admin(id).name; }
function adminColor(id) {
  const a = admin(id); if (a.color) return a.color;
  const ids = App.admins.map(x => x.admin_id).sort(); const i = ids.indexOf(id);
  return COLORS[(i < 0 ? ids.length : i) % COLORS.length];
}
function telLink(phone) { const p = String(phone || ""); return p ? `<a href="tel:${esc(p.replace(/[^0-9+]/g, ""))}" onclick="event.stopPropagation()">${esc(p)}</a>` : ""; }
function mapLink(address, label) { return address ? `<a href="https://map.kakao.com/link/search/${encodeURIComponent(address)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(label || address)}</a>` : ""; }
function statusPill(s) {
  s = s || "예약접수";
  const cls = s === "작업완료" ? "ok" : s.includes("취소") ? "danger" : s === "예약확정" ? "info" : "";
  return `<span class="pill ${cls}">${esc(s)}</span>`;
}
function payPill(s) { return `<span class="pill ${s === "결제완료" ? "ok" : s === "부분결제" ? "warn" : "danger"}">${esc(s)}</span>`; }
function ageBadge(days) {
  const c = days >= 30 ? "danger" : days >= 7 ? "warn" : "ok";
  return `<span class="pill ${c}">${days === 0 ? "오늘" : days + "일 경과"}</span>`;
}
function isDone(s) { return ["작업완료", "매출확정", "완료"].includes(s); }
function adminOptions(selected, withAll) {
  return (withAll ? `<option value="">${withAll}</option>` : "") + App.admins.map(a => `<option value="${esc(a.admin_id)}" ${a.admin_id === selected ? "selected" : ""}>${esc(a.name)}</option>`).join("");
}
function timeOptions(selected, from, to, step) {
  let h = ""; for (let m = from; m <= to; m += step) h += `<option ${hhmm(m) === selected ? "selected" : ""}>${hhmm(m)}</option>`; return h;
}
function debounce(fn, ms) { let t; return function () { clearTimeout(t); const a = arguments; t = setTimeout(() => fn.apply(this, a), ms || 250); }; }
function kw(s) { return String(s || "").toLowerCase().replace(/[-\s]/g, ""); }

/* --- 내 계정 (비밀번호 변경) --- */
function openMyAccount() {
  const m = openModal({
    title: "내 계정",
    body: `<dl class="kv"><dt>이름</dt><dd>${esc(App.me.name)}</dd><dt>아이디</dt><dd>${esc(App.me.login_id)}</dd><dt>권한</dt><dd>${isSuper() ? "최고관리자" : "관리자"}</dd></dl>
      <div class="section-title">비밀번호 변경</div>
      <label>현재 비밀번호<input type="password" id="pwCur" autocomplete="current-password"></label>
      <label>새 비밀번호 (4자 이상)<input type="password" id="pwNew" autocomplete="new-password"></label>
      <label>새 비밀번호 확인<input type="password" id="pwNew2" autocomplete="new-password"></label>`,
    foot: `<button class="btn" data-close2>닫기</button><button class="btn primary" data-save>비밀번호 변경</button>`
  });
  m.$("[data-close2]").onclick = m.close;
  m.$("[data-save]").onclick = async () => {
    if (val("pwNew") !== val("pwNew2")) return toast("새 비밀번호 확인이 다릅니다.", true);
    await run(() => api("change_password", { current_password: val("pwCur"), new_password: val("pwNew") }), "비밀번호를 바꿨습니다.");
    m.close();
  };
}

/* --- 시작 --- */
window.addEventListener("load", async () => {
  if ("ontouchstart" in window) document.body.classList.add("touch");
  // 서버가 페이지에 미리 넣어 준 상호·색 (없으면 서버에 물어봄)
  const boot = window.BOOT && typeof window.BOOT === "object" ? window.BOOT : null;
  if (boot) applyBrand(boot.company_name, boot.brand_color);
  const t = Store.get(("bc_token_" + window.COMPANY_CODE));
  if (t) { App.token = t; try { await startApp(); return; } catch (e) { localLogout(); } }
  if (boot) { if (boot.need_setup) { document.getElementById("loginView").hidden = true; document.getElementById("setupView").hidden = false; } return; }
  try {
    const info = await api("public_info", {}, { silent: true });
    applyBrand(info.company_name, info.brand_color);
    if (info.need_setup) { document.getElementById("loginView").hidden = true; document.getElementById("setupView").hidden = false; }
  } catch (e) { const l = document.getElementById("loginLogo"); if (l) l.textContent = "관리 프로그램"; }
});
</script>

<script>
/* ===== 대시보드: 요약 카드 + 월간 캘린더 + 일자 시간표 ===== */
const Dash = { month: "", selected: "", assignee: "", data: null, day: null };

Views.dashboard = {
  async render(el) {
    if (!Dash.month) { Dash.selected = todayStr(); Dash.month = Dash.selected.slice(0, 7); }
    el.innerHTML = `
      <div class="page-head"><h2>대시보드</h2><button class="btn ghost sm" onclick="refreshView(true)">새로고침</button></div>
      <div class="cards">
        <div class="card link" onclick="go('reservations',{from:todayStr(),to:todayStr()})"><div class="label">오늘 예약</div><div class="value" id="dToday">-</div></div>
        <div class="card link" onclick="go('sales',{tab:'list',from:todayStr(),to:todayStr()})"><div class="label">오늘 매출</div><div class="value" id="dSales">-</div></div>
        <div class="card link" onclick="go('sales',{tab:'recv'})"><div class="label">미수금</div><div class="value red" id="dRecv">-</div></div>
        <div class="card link" onclick="go('inventory',{low:true})"><div class="label">재고 주의</div><div class="value" id="dLow">-</div></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <div class="row"><button class="btn sm" onclick="dashMonth(-1)">◀</button><h3 id="calTitle" style="min-width:110px;text-align:center"></h3><button class="btn sm" onclick="dashMonth(1)">▶</button><button class="btn sm ghost" onclick="dashToday()">오늘</button></div>
          <div class="tabs" id="dashTabs" style="margin:0"></div>
        </div>
        <div class="cal-head">${WD.map((d, i) => `<div style="color:${i === 0 ? "#dc2626" : i === 6 ? "#2563eb" : ""}">${d}</div>`).join("")}</div>
        <div class="cal" id="calGrid"></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <h3 id="dayTitle"></h3>
          <div class="row">
            <span class="xs muted"><span class="dot" style="background:#bbf7d0"></span>빈 시간 = 눌러서 예약</span>
            <button class="btn sm primary" onclick="openReservationForm({date:Dash.selected, assignee_id:Dash.assignee})">+ 이 날짜 예약</button>
          </div>
        </div>
        <div id="daySum" class="small muted" style="margin-bottom:8px"></div>
        <div class="table-wrap" id="dayWrap"></div>
      </div>`;
    renderDashTabs();
    await loadDash();
  }
};

function renderDashTabs() {
  const box = document.getElementById("dashTabs"); if (!box) return;
  box.innerHTML = `<button class="${Dash.assignee ? "" : "active"}" onclick="dashAssignee('')">전체</button>` +
    App.admins.map(a => `<button class="${Dash.assignee === a.admin_id ? "active" : ""}" onclick="dashAssignee('${esc(a.admin_id)}')"><span class="dot" style="background:${adminColor(a.admin_id)}"></span>${esc(a.name)}</button>`).join("");
}
function dashAssignee(id) { Dash.assignee = id; renderDashTabs(); renderCalendar(); renderDay(); }
function dashMonth(d) { const p = Dash.month.split("-").map(Number); const x = new Date(p[0], p[1] - 1 + d, 1); Dash.month = x.getFullYear() + "-" + pad(x.getMonth() + 1); loadDash(true); }
function dashToday() { Dash.selected = todayStr(); Dash.month = Dash.selected.slice(0, 7); loadDash(); }

async function loadDash(monthOnly) {
  try {
    Dash.data = await api("dashboard", monthOnly ? { month: Dash.month } : { month: Dash.month, date: Dash.selected });
    const d = Dash.data;
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
    set("dToday", d.today_reservations + "건"); set("dSales", money(d.today_sales)); set("dRecv", money(d.receivable)); set("dLow", d.low_stock + "건");
    setNavBadge("sales", d.receivable_count);
    renderCalendar();
    if (!monthOnly) {
      if (Dash.data.day) { Dash.day = Dash.data.day; document.getElementById("dayTitle").textContent = fullDayLabel(Dash.selected) + " 시간표"; renderDay(); }
      else await loadDay(Dash.selected);
    }
  } catch (e) { toast(e.message, true); }
}

function renderCalendar() {
  const grid = document.getElementById("calGrid"); if (!grid || !Dash.data) return;
  const [y, m] = Dash.month.split("-").map(Number);
  document.getElementById("calTitle").textContent = `${y}년 ${m}월`;
  const byDate = {};
  Dash.data.calendar.forEach(r => {
    if (Dash.assignee && r.assignee_id !== Dash.assignee) return;
    (byDate[r.reservation_date] = byDate[r.reservation_date] || []).push(r);
  });
  const first = new Date(y, m - 1, 1), start = new Date(y, m - 1, 1 - first.getDay()), today = todayStr();
  let h = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i >= 35 && d.getMonth() !== m - 1) break;
    const ds = ymd(d), list = (byDate[ds] || []).sort((a, b) => a.start_time.localeCompare(b.start_time));
    const cls = ["cal-cell", d.getMonth() !== m - 1 ? "other" : "", ds === today ? "today" : "", ds === Dash.selected ? "sel" : ""].join(" ");
    const color = d.getDay() === 0 ? "#dc2626" : d.getDay() === 6 ? "#2563eb" : "";
    h += `<button class="${cls}" onclick="dashSelect('${ds}')"><span class="d" style="${ds === today ? "" : "color:" + color}">${d.getDate()}</span>` +
      list.slice(0, 3).map(r => `<div class="cal-chip ${isDone(r.status) ? "done" : ""}" style="background:${adminColor(r.assignee_id)}">${esc(r.start_time)} ${esc(r.customer_name)}</div>`).join("") +
      (list.length > 3 ? `<div class="cal-more">+${list.length - 3}건</div>` : "") + `</button>`;
  }
  grid.innerHTML = h;
}

async function dashSelect(ds) {
  Dash.selected = ds;
  if (ds.slice(0, 7) !== Dash.month) { Dash.month = ds.slice(0, 7); await loadDash(true); }
  renderCalendar();
  await loadDay(ds);
  if (window.innerWidth < 860) document.getElementById("dayTitle").scrollIntoView({ behavior: "smooth", block: "start" });
}

async function loadDay(ds) {
  document.getElementById("dayTitle").textContent = fullDayLabel(ds) + " 시간표";
  try { Dash.day = await api("schedule", { date: ds }); renderDay(); }
  catch (e) { toast(e.message, true); }
}

function renderDay() {
  const wrap = document.getElementById("dayWrap"); if (!wrap || !Dash.day) return;
  const ds = Dash.day.date;
  let cols = Dash.day.assignees;
  if (Dash.assignee) cols = cols.filter(a => a.assignee_id === Dash.assignee);
  if (!cols.length) { wrap.innerHTML = '<div class="empty">담당자가 없습니다.</div>'; return; }
  let from = 480, to = 1200;
  cols.forEach(a => {
    a.windows.forEach(w => { from = Math.min(from, toMin(w.start)); to = Math.max(to, toMin(w.end)); });
    a.reservations.forEach(r => { from = Math.min(from, toMin(r.start_time)); to = Math.max(to, toMin(r.end_time)); });
  });
  from = Math.floor(from / 60) * 60; to = Math.ceil(to / 60) * 60;
  const step = 30, rows = (to - from) / step, today = todayStr();
  const firstFree = App.allowPast ? 0 : ds < today ? 1e9 : ds === today ? Math.ceil((nowMinutes() + 1) / step) * step : 0;
  const narrow = window.innerWidth < 600, colMin = narrow ? 96 : 150, timeCol = narrow ? 42 : 56;
  const rowOf = m => Math.floor((m - from) / step) + 2;
  let h = `<div class="tl" style="grid-template-columns:${timeCol}px repeat(${cols.length},minmax(${colMin}px,1fr));grid-template-rows:auto repeat(${rows},28px);min-width:${timeCol + cols.length * colMin}px">`;
  h += `<div class="tl-head tl-corner" style="grid-column:1;grid-row:1"></div>`;
  let free = 0, resCount = 0;
  cols.forEach((a, i) => {
    const col = i + 2, color = adminColor(a.assignee_id);
    h += `<div class="tl-head" style="grid-column:${col};grid-row:1"><span class="dot" style="background:${color}"></span>${esc(a.name)}
      <div class="xs" style="font-weight:400;color:${a.off ? "#dc2626" : "#8a9099"}">${a.off ? "휴무" : a.windows.map(w => w.start + "~" + w.end).join(", ")}</div></div>`;
    const wins = a.windows.map(w => ({ s: toMin(w.start), e: toMin(w.end) }));
    const busy = a.reservations.map(r => ({ s: toMin(r.start_time), e: toMin(r.end_time) }));
    for (let m = from; m < to; m += step) {
      const inWork = wins.some(w => m >= w.s && m + step <= w.e);
      const taken = busy.some(b => m < b.e && m + step > b.s);
      let cls = "tl-cell", attr = "";
      if (taken) cls += "";
      else if (!inWork) cls += " tl-off";
      else if (m < firstFree) cls += " tl-past";
      else { cls += " tl-free"; free++; attr = `onclick="openReservationForm({date:'${ds}',assignee_id:'${esc(a.assignee_id)}',start:'${hhmm(m)}'})" title="${esc(a.name)} ${hhmm(m)} 예약"`; }
      h += `<div class="${cls}" style="grid-column:${col};grid-row:${rowOf(m)}" ${attr}></div>`;
    }
    a.reservations.forEach(r => {
      resCount++;
      const s = toMin(r.start_time), span = Math.max(1, Math.ceil((toMin(r.end_time) - s) / step));
      h += `<div class="tl-res ${isDone(r.status) ? "done" : ""}" style="grid-column:${col};grid-row:${rowOf(s)} / span ${span};background:${color}" onclick="openReservationDetail('${esc(r.reservation_id)}')">
        <b>${esc(r.start_time)}~${esc(r.end_time)} ${esc(r.customer_name)}</b>${span > 1 ? `<div>${esc(r.service_text)}</div>` : ""}${span > 2 ? `<div class="xs">${esc(r.status)}</div>` : ""}</div>`;
    });
  });
  for (let m = from; m < to; m += step) h += `<div class="tl-time" style="grid-column:1;grid-row:${rowOf(m)}">${m % 60 === 0 ? hhmm(m) : ""}</div>`;
  h += "</div>";
  wrap.innerHTML = h;
  const need = timeCol + cols.length * colMin;
  document.getElementById("daySum").innerHTML = `예약 <b>${resCount}건</b> · 예약 가능 <b class="green">${free}칸</b>(30분)` +
    (ds < today ? " · 지난 날짜" : "") + (need > wrap.clientWidth + 4 ? ` · <span style="color:#2563eb">옆으로 밀면 다른 담당자가 보여요 →</span>` : "");
}
</script>

<script>
/* ===== 예약: 목록 / 등록·일정변경 / 상세 / 작업완료 ===== */
const Res = { list: [], customers: null, filters: { assignee: "", from: "", to: "", status: "", q: "" }, loadedFrom: null, limit: 200 };
const RES_WINDOW_DAYS = 90; // [속도] 기본은 최근 90일 + 앞으로의 예약만 받음. 더 이전은 날짜를 고르거나 '전체 기간'을 누르면 받음
function resNeedFrom() { const f = Res.filters.from; const def = addDays(todayStr(), -RES_WINDOW_DAYS); return Res.all ? "" : (f && f < def ? f : def); }
async function resLoad() {
  const from = resNeedFrom();
  if (Res.loadedFrom !== null && (Res.loadedFrom === "" || (from && from >= Res.loadedFrom))) return;
  Res.list = await api("reservations", from ? { from } : {});
  Res.loadedFrom = from;
}

Views.reservations = {
  async render(el, params) {
    if (params.from !== undefined) { Res.filters.from = params.from; Res.filters.to = params.to || params.from; Res.filters.status = ""; }
    const f = Res.filters;
    el.innerHTML = `
      <div class="page-head"><h2>예약</h2><button class="btn primary" onclick="openReservationForm({})">+ 예약 등록</button></div>
      <div class="panel">
        <div class="filters">
          <select id="rfA" onchange="resFilter()">${adminOptions(f.assignee, "전체 담당자")}</select>
          <input type="date" id="rfFrom" value="${f.from}" onchange="resFilter()">
          <input type="date" id="rfTo" value="${f.to}" onchange="resFilter()">
          <select id="rfS" onchange="resFilter()">
            <option value="">전체 상태</option><option value="open">작업 전(접수·확정)</option><option>예약접수</option><option>예약확정</option><option>작업완료</option><option>취소</option><option value="unpaid">미수금 있음</option>
          </select>
          <input type="search" id="rfQ" class="grow" placeholder="고객명·전화·주소·서비스·예약번호" value="${esc(f.q)}" oninput="resFilterDebounced()">
        </div>
        <div class="quick">
          <button class="btn sm" onclick="resRange('today')">오늘</button><button class="btn sm" onclick="resRange('tomorrow')">내일</button>
          <button class="btn sm" onclick="resRange('week')">이번 주</button><button class="btn sm" onclick="resRange('month')">이번 달</button>
          <button class="btn sm" onclick="resRange('all')">전체 기간</button>
          <span class="grow"></span><span class="small muted" id="rfCount"></span>
        </div>
        <div id="resList"><div class="empty">불러오는 중...</div></div>
      </div>`;
    document.getElementById("rfS").value = f.status;
    Res.loadedFrom = null; Res.limit = 200;
    try { await resLoad(); renderResList(); } catch (e) { toast(e.message, true); }
  }
};
const resFilterDebounced = debounce(resFilter, 200);
function resFilter() {
  Res.filters = { assignee: val("rfA"), from: val("rfFrom"), to: val("rfTo"), status: document.getElementById("rfS").value, q: val("rfQ") };
  Res.limit = 200;
  resLoad().then(renderResList, e => toast(e.message, true));
}
function resRange(k) {
  const t = todayStr(); let a = "", b = "";
  if (k === "today") a = b = t;
  else if (k === "tomorrow") a = b = addDays(t, 1);
  else if (k === "week") { const d = new Date(); a = addDays(t, -((d.getDay() + 6) % 7)); b = addDays(a, 6); }
  else if (k === "month") { const d = new Date(); a = ymd(new Date(d.getFullYear(), d.getMonth(), 1)); b = ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
  Res.all = k === "all";
  document.getElementById("rfFrom").value = a; document.getElementById("rfTo").value = b; resFilter();
}
function renderResList() {
  const f = Res.filters, q = kw(f.q);
  let rows = Res.list.filter(r => {
    if (f.assignee && r.assignee_id !== f.assignee) return false;
    if (f.from && r.reservation_date < f.from) return false;
    if (f.to && r.reservation_date > f.to) return false;
    if (f.status === "open" && (isDone(r.status) || r.status.includes("취소"))) return false;
    if (f.status === "unpaid" && !(r.remaining > 0)) return false;
    if (f.status && !["open", "unpaid"].includes(f.status) && r.status !== f.status) return false;
    if (q && !kw([r.reservation_id, r.customer_name, r.customer_phone, r.address, r.service_text, r.customer_request, adminName(r.assignee_id)].join(" ")).includes(q)) return false;
    return true;
  });
  if (f.from || f.to) rows = rows.slice().sort((a, b) => (a.reservation_date + a.start_time).localeCompare(b.reservation_date + b.start_time));
  const total = rows.reduce((s, r) => s + r.final_amount, 0);
  document.getElementById("rfCount").textContent = `${rows.length}건 · ${money(total)}` + (Res.loadedFrom ? ` · ${dayLabel(Res.loadedFrom)} 이후` : "");
  const more = rows.length > Res.limit ? rows.length - Res.limit : 0;
  rows = rows.slice(0, Res.limit); // [속도] 한 번에 200건까지만 그림
  document.getElementById("resList").innerHTML = (rows.length ? rows.map(r => `
    <div class="item" onclick="openReservationDetail('${esc(r.reservation_id)}')">
      <div class="main-col">
        <div class="row"><span class="b">${dayLabel(r.reservation_date)} ${esc(r.start_time)}~${esc(r.end_time)}</span>${statusPill(r.status)}
          <span class="small"><span class="dot" style="background:${adminColor(r.assignee_id)}"></span>${esc(adminName(r.assignee_id))}</span></div>
        <div class="title" style="margin-top:3px">${esc(r.customer_name)} <span class="small muted" style="font-weight:400">${telLink(r.customer_phone)}</span></div>
        <div class="sub">${esc(r.service_text)}${r.address ? " · " + esc(r.address) : ""}</div>
        ${r.customer_request ? `<div class="sub">💬 ${esc(r.customer_request)}</div>` : ""}
      </div>
      <div class="side-col"><div class="b">${money(r.final_amount)}</div>${r.remaining > 0 ? `<div class="xs red">미수 ${money(r.remaining)}</div>` : ""}<div class="xs faint">${esc(r.reservation_id)}</div></div>
    </div>`).join("") : `<div class="empty">${Res.list.length ? "조건에 맞는 예약이 없습니다." : "등록된 예약이 없습니다."}</div>`)
    + (more ? `<div style="padding:10px;text-align:center"><button class="btn" onclick="Res.limit+=200;renderResList()">${more}건 더 보기</button></div>` : "")
    + (Res.loadedFrom && !Res.filters.from ? `<div class="xs muted" style="padding:6px;text-align:center">${dayLabel(Res.loadedFrom)} 이전 예약은 날짜를 고르거나 [전체 기간]을 누르세요.</div>` : "");
}

async function loadCustomersCache(force) {
  if (!Res.customers || force) Res.customers = await api("customers", {}, { silent: true });
  return Res.customers;
}

/* ---------- 예약 등록 / 일정 변경 ---------- */
// opts: {date, assignee_id, start, customer, edit: 예약객체(일정변경)}
async function openReservationForm(opts) {
  opts = opts || {};
  const edit = opts.edit || null;
  const F = { date: opts.date || (edit && edit.reservation_date) || todayStr(), assignee: opts.assignee_id || (edit && edit.assignee_id) || (App.me && App.me.admin_id) || "", start: opts.start || (edit && edit.start_time) || "", end: (edit && edit.end_time) || "", schedule: null, manualEnd: !!edit, customer: opts.customer || null };
  if (F.date < todayStr() && !App.allowPast) F.date = todayStr();
  const m = openModal({
    title: edit ? "일정 변경" : "예약 등록", wide: true, sticky: true,
    body: `
      ${edit ? `<div class="box small" style="margin-bottom:8px"><b>${esc(edit.customer_name)}</b> · ${esc(edit.service_text)}<br><span class="muted">현재: ${dayLabel(edit.reservation_date)} ${esc(edit.start_time)}~${esc(edit.end_time)} / ${esc(adminName(edit.assignee_id))}</span></div>` : `
      <div class="section-title" style="margin-top:0">고객</div>
      <label class="check" style="margin:0 0 8px"><input type="checkbox" id="fLinkMode"> 고객이 직접 정보를 입력하도록 링크로 보내기</label>
      <div id="fLinkBox" class="box small" hidden>
        아래에서 정한 날짜·시간·서비스로 <b>고객 입력 링크</b>를 만듭니다. 고객이 링크에서 이름·연락처·주소를 입력하면 예약(예약접수)이 자동 등록됩니다.
        입력을 기다리는 동안 그 시간은 다른 예약이 들어오지 않도록 잡아 둡니다.
        <label style="margin-top:8px">링크 유효시간<select id="fLinkHours"><option value="3">3시간</option><option value="24" selected>24시간</option><option value="72">3일</option><option value="168">7일</option></select></label>
        <div class="xs muted" style="margin-top:4px">예약 시작시간이 먼저 오면 그때 만료됩니다.</div>
      </div>
      <div id="fCustArea">
      <div id="fCustSel"></div>
      <div class="row" id="fCustSearchRow"><input type="search" id="fCustQ" class="grow" placeholder="고객명·전화번호로 검색" autocomplete="off"><button class="btn" id="fNewCust">+ 신규 고객</button></div>
      <div id="fCustResults"></div>
      </div>`}
      <div class="section-title">일정</div>
      <div class="grid2">
        <label>예약일<input type="date" id="fDate" ${App.allowPast ? "" : `min="${todayStr()}"`} value="${F.date}"></label>
        <label>담당자<select id="fAssignee">${adminOptions(F.assignee)}</select></label>
        <label>시작<select id="fStart"></select></label>
        <label>종료<select id="fEnd"></select></label>
      </div>
      <div class="xs muted" id="fWorkMsg" style="margin-top:4px"></div>
      <div class="board" id="fBoard"></div>
      ${edit ? "" : `
      <div class="section-title">서비스</div>
      <div id="fLines"></div>
      <div class="row" style="margin-top:6px"><button class="btn sm" id="fAddLine">+ 서비스 추가</button><button class="btn sm ghost" id="fNewSvc">+ 신규 서비스 등록</button></div>
      <div class="grid2">
        <label>추가금액<input type="number" id="fExtra" min="0" step="1000" value="0"></label>
        <label>할인금액<input type="number" id="fDiscount" min="0" step="1000" value="0"></label>
        <label>추가 사유<input id="fExtraReason"></label>
        <label>할인 사유<input id="fDiscountReason"></label>
      </div>
      <div class="box" style="margin-top:12px"><div class="sum-row"><span>서비스 금액</span><span id="fSvcSum">0원</span></div><div class="sum-row total"><span>예상 금액</span><span id="fTotal">0원</span></div></div>
      <div class="grid2">
        <label id="fRequestWrap">고객 요청사항<textarea id="fRequest"></textarea></label>
        <label>관리자 메모<textarea id="fMemo"></textarea></label>
      </div>
      <label class="check" id="fConfirmedWrap"><input type="checkbox" id="fConfirmed"> 예약 확정으로 등록</label>`}
      <div class="form-msg" id="fMsg" style="text-align:left"></div>`,
    foot: `<button class="btn" data-cancel>취소</button><button class="btn primary" id="fSave">${edit ? "일정 변경 저장" : "예약 저장"}</button>`
  });
  m.$("[data-cancel]").onclick = m.close;
  const $ = id => m.querySelector("#" + id);

  /* 고객 */
  function renderCustomerSel() {
    if (edit) return;
    $("fCustSel").innerHTML = F.customer ? `<div class="box row"><div class="grow"><b>${esc(F.customer.name)}</b> ${telLink(F.customer.phone)}<div class="xs muted">${esc([F.customer.address, F.customer.detail_address].filter(Boolean).join(" "))}${F.customer.memo ? " · " + esc(F.customer.memo) : ""}</div></div><button class="btn sm" id="fCustChange">변경</button></div>` : "";
    $("fCustSearchRow").hidden = !!F.customer;
    $("fCustResults").innerHTML = "";
    if (F.customer) $("fCustChange").onclick = () => { F.customer = null; renderCustomerSel(); $("fCustQ").focus(); };
    refreshSave();
  }
  if (!edit) {
    const search = debounce(async () => {
      const q = kw($("fCustQ").value);
      if (!q) { $("fCustResults").innerHTML = ""; return; }
      const list = (await loadCustomersCache()).filter(c => kw([c.name, c.phone, c.address].join(" ")).includes(q)).slice(0, 8);
      $("fCustResults").innerHTML = `<div class="box" style="margin-top:6px;padding:4px">${list.length ? list.map(c => `<div class="item" data-cid="${esc(c.customer_id)}" style="padding:8px"><div class="main-col"><div class="title">${esc(c.name)} <span class="small muted">${esc(c.phone)}</span></div><div class="sub">${esc(c.address)} ${esc(c.detail_address)}${c.visit_count ? " · 방문 " + c.visit_count + "회" : ""}</div></div></div>`).join("") : '<div class="empty" style="padding:10px">검색 결과가 없습니다. [+ 신규 고객]으로 등록하세요.</div>'}</div>`;
      $("fCustResults").querySelectorAll("[data-cid]").forEach(x => x.onclick = () => { F.customer = Res.customers.find(c => c.customer_id === x.dataset.cid); renderCustomerSel(); });
    }, 200);
    $("fCustQ").oninput = search;
    $("fNewCust").onclick = () => openCustomerForm({ name: /\d/.test($("fCustQ").value) ? "" : $("fCustQ").value, phone: /\d/.test($("fCustQ").value) ? $("fCustQ").value : "" }, async c => {
      await loadCustomersCache(true); F.customer = Res.customers.find(x => x.customer_id === c.customer_id) || c; renderCustomerSel();
    });
    loadCustomersCache();
    renderCustomerSel();
    // 고객 입력 링크 모드
    $("fLinkMode").onchange = () => {
      F.linkMode = $("fLinkMode").checked;
      $("fCustArea").hidden = F.linkMode; $("fLinkBox").hidden = !F.linkMode;
      $("fRequestWrap").hidden = F.linkMode; $("fConfirmedWrap").hidden = F.linkMode;
      $("fSave").textContent = F.linkMode ? "🔗 입력 링크 만들기" : "예약 저장";
      refreshSave();
    };
  }

  /* 서비스 줄 */
  function addLine(sid, qty) {
    const row = document.createElement("div");
    row.className = "line";
    row.innerHTML = `<select class="lsvc"><option value="">서비스 선택</option>${App.services.filter(s => s.active === "Y").map(s => `<option value="${esc(s.service_id)}">${esc(s.service_name)} (${money(s.base_price)})</option>`).join("")}</select>
      <input type="number" class="lqty" min="1" value="${qty || 1}"><input class="lamt right" readonly><button class="btn sm ghost">✕</button>`;
    row.querySelector(".lsvc").value = sid || "";
    row.querySelector(".lsvc").onchange = () => { calc(); updateEnds(); };
    row.querySelector(".lqty").oninput = () => { calc(); updateEnds(); };
    row.querySelector("button").onclick = () => { row.remove(); if (!$("fLines").children.length) addLine(); calc(); updateEnds(); };
    $("fLines").appendChild(row); calc();
  }
  // [신규 서비스 등록] 저장 후: 서비스 목록 새로 받고, 비어 있는 줄(없으면 새 줄)에 새 서비스를 넣음
  function svcOptions() { return `<option value="">서비스 선택</option>${App.services.filter(s => s.active === "Y").map(s => `<option value="${esc(s.service_id)}">${esc(s.service_name)} (${money(s.base_price)})</option>`).join("")}`; }
  if (!edit) $("fNewSvc").onclick = () => openServiceForm({ parts: [] }, async saved => {
    try { App.services = await api("services", {}, { fresh: true }); } catch (e) {}
    [...$("fLines").children].forEach(r => { const sel = r.querySelector(".lsvc"), v = sel.value; sel.innerHTML = svcOptions(); sel.value = v; });
    const empty = [...$("fLines").children].find(r => !r.querySelector(".lsvc").value);
    if (empty) empty.querySelector(".lsvc").value = saved.service_id; else addLine(saved.service_id);
    calc(); updateEnds();
  });
  function lines() {
    if (edit) return [];
    return [...$("fLines").children].map(r => {
      const s = App.services.find(x => x.service_id === r.querySelector(".lsvc").value);
      const q = Math.max(1, num(r.querySelector(".lqty").value));
      return s ? { service_id: s.service_id, service_name: s.service_name, quantity: q, unit_price: s.base_price, amount: q * s.base_price, duration: s.duration_min * q } : null;
    }).filter(Boolean);
  }
  function calc() {
    if (edit) return;
    [...$("fLines").children].forEach(r => { const s = App.services.find(x => x.service_id === r.querySelector(".lsvc").value); r.querySelector(".lamt").value = s ? money(s.base_price * Math.max(1, num(r.querySelector(".lqty").value))) : ""; });
    const svc = lines().reduce((a, l) => a + l.amount, 0);
    $("fSvcSum").textContent = money(svc);
    $("fTotal").textContent = money(Math.max(0, svc + num($("fExtra").value) - num($("fDiscount").value)));
    refreshSave();
  }
  if (!edit) {
    $("fAddLine").onclick = () => addLine();
    // 견적서에서 넘어온 경우: 서비스·추가/할인·메모 미리 채움
    const pre = (opts.lines || []).filter(l => App.services.some(s => s.service_id === l.service_id));
    if (pre.length) pre.forEach(l => addLine(l.service_id, l.qty)); else addLine();
    if (opts.extra) { $("fExtra").value = opts.extra; $("fExtraReason").value = opts.extraReason || ""; }
    if (opts.discount) { $("fDiscount").value = opts.discount; $("fDiscountReason").value = opts.discountReason || ""; }
    if (opts.memo) $("fMemo").value = opts.memo;
    ["fExtra", "fDiscount"].forEach(id => $(id).oninput = calc);
    calc();
  }

  /* 일정 */
  function sched() { return (F.schedule && F.schedule.assignees.find(a => a.assignee_id === F.assignee)) || { windows: [], reservations: [], off: false }; }
  function busyOf(a) { return a.reservations.filter(r => !edit || r.reservation_id !== edit.reservation_id).map(r => ({ s: toMin(r.start_time), e: toMin(r.end_time), r })); }
  function firstMinute() { return App.allowPast ? 0 : F.date === todayStr() ? Math.ceil((nowMinutes() + 1) / App.slot) * App.slot : 0; }
  async function loadSchedule() {
    $("fStart").innerHTML = "<option>확인 중...</option>"; $("fEnd").innerHTML = "";
    try { F.schedule = await api("schedule", { date: F.date }, { silent: true }); } catch (e) { F.schedule = null; toast(e.message, true); }
    fillStarts();
  }
  function fillStarts() {
    const a = sched(), busy = busyOf(a), first = firstMinute(), step = App.slot;
    let h = "", starts = [];
    a.windows.forEach(w => {
      for (let t = toMin(w.start); t + step <= toMin(w.end); t += step) {
        const taken = busy.some(b => t < b.e && t + step > b.s), past = t < first;
        h += `<option value="${hhmm(t)}" ${taken || past ? "disabled" : ""}>${hhmm(t)}${taken ? " (예약있음)" : past ? " (지남)" : ""}</option>`;
        if (!taken && !past) starts.push(hhmm(t));
      }
    });
    $("fStart").innerHTML = starts.length ? h : '<option value="">가능한 시간 없음</option>';
    $("fWorkMsg").innerHTML = a.off ? '<span class="red">이 날은 담당자 휴무입니다. 다른 담당자나 날짜를 고르세요.</span>' : `근무시간 ${a.windows.map(w => w.start + "~" + w.end).join(", ")} · 예약있는 시간은 선택할 수 없어요`;
    F.start = starts.includes(F.start) ? F.start : (starts[0] || "");
    $("fStart").value = F.start;
    updateEnds();
  }
  function endLimit(start) {
    const a = sched(); const w = a.windows.find(x => start >= toMin(x.start) && start < toMin(x.end));
    let lim = w ? toMin(w.end) : start;
    busyOf(a).forEach(b => { if (b.s > start && b.s < lim) lim = b.s; });
    return lim;
  }
  function updateEnds() {
    const s = toMin(F.start);
    if (s === null) { $("fEnd").innerHTML = ""; F.end = ""; renderBoard(); refreshSave(); return; }
    const lim = endLimit(s), step = App.slot;
    const dur = Math.max(step, lines().reduce((a, l) => a + l.duration, 0) || 60);
    const want = Math.min(lim, s + Math.ceil(dur / step) * step);
    let h = ""; for (let t = s + step; t <= lim; t += step) h += `<option>${hhmm(t)}</option>`;
    $("fEnd").innerHTML = h;
    if (!(F.manualEnd && toMin(F.end) > s && toMin(F.end) <= lim)) { F.end = hhmm(want); F.manualEnd = false; }
    $("fEnd").value = F.end;
    $("fMsg").textContent = (s + dur > lim) ? `※ 예상 소요시간(${dur}분)보다 빈 시간이 짧아요. ${hhmm(lim)}에 다음 예약/근무종료가 있어요.` : "";
    renderBoard(); refreshSave();
  }
  function renderBoard() {
    const box = $("fBoard"); if (!F.schedule) { box.innerHTML = ""; return; }
    let from = 480, to = 1200;
    F.schedule.assignees.forEach(a => { a.windows.forEach(w => { from = Math.min(from, toMin(w.start)); to = Math.max(to, toMin(w.end)); }); a.reservations.forEach(r => { from = Math.min(from, toMin(r.start_time)); to = Math.max(to, toMin(r.end_time)); }); });
    from = Math.floor(from / 60) * 60; to = Math.ceil(to / 60) * 60;
    const span = to - from, pct = x => ((x - from) / span * 100).toFixed(2) + "%", w = (a, b) => ((b - a) / span * 100).toFixed(2) + "%";
    const first = firstMinute(), step = App.slot;
    let ticks = ""; for (let t = from; t <= to; t += 120) ticks += `<span style="left:${pct(t)}">${t / 60}</span>`;
    box.innerHTML = `<div class="row xs muted" style="justify-content:space-between"><b style="color:#111">담당자별 빈 시간 (${dayLabel(F.date)})</b><span>초록 칸을 누르면 그 시간으로 · 같은 줄 뒤쪽을 한 번 더 누르면 종료시간 연장</span></div>
      <div class="board-row"><span></span><div class="board-ticks">${ticks}</div></div>` +
      F.schedule.assignees.map(a => {
        const busy = busyOf(a);
        let free = "";
        if (!a.off) a.windows.forEach(x => { for (let t = toMin(x.start); t + step <= toMin(x.end); t += step) if (t >= first && !busy.some(b => t < b.e && t + step > b.s)) free += `<div class="b-free" data-a="${esc(a.assignee_id)}" data-t="${t}" style="left:${pct(t)};width:${w(t, t + step)}" title="${esc(a.name)} ${hhmm(t)}"></div>`; });
        const sel = a.assignee_id === F.assignee;
        const pick = sel && F.start && F.end ? `<div class="b-pick" style="left:${pct(toMin(F.start))};width:${w(toMin(F.start), toMin(F.end))}"></div>` : "";
        return `<div class="board-row"><button class="board-name ${sel ? "sel" : ""}" data-pick-a="${esc(a.assignee_id)}">${esc(a.name)}${a.off ? " (휴무)" : ""}</button>
          <div class="board-track">${a.windows.map(x => `<div class="b-work" style="left:${pct(toMin(x.start))};width:${w(toMin(x.start), toMin(x.end))}"></div>`).join("")}${free}
          ${busy.map(b => `<div class="b-res" style="left:${pct(b.s)};width:${w(b.s, b.e)}" title="${esc(b.r.start_time + "~" + b.r.end_time + " " + b.r.customer_name)}">${esc(b.r.customer_name)}</div>`).join("")}${pick}</div></div>`;
      }).join("");
    box.querySelectorAll("[data-pick-a]").forEach(b => b.onclick = () => { F.assignee = b.dataset.pickA; $("fAssignee").value = F.assignee; F.manualEnd = false; fillStarts(); });
    box.querySelectorAll(".b-free").forEach(b => b.onclick = () => {
      const a = b.dataset.a, t = Number(b.dataset.t);
      if (a !== F.assignee) { F.assignee = a; $("fAssignee").value = a; F.start = hhmm(t); F.manualEnd = false; fillStarts(); return; }
      const s = toMin(F.start);
      if (s !== null && t > s && t + step <= endLimit(s)) { F.end = hhmm(t + step); F.manualEnd = true; $("fEnd").value = F.end; renderBoard(); refreshSave(); }
      else { F.start = hhmm(t); F.manualEnd = false; $("fStart").value = F.start; updateEnds(); }
    });
  }
  $("fDate").onchange = () => { F.date = $("fDate").value; F.manualEnd = false; loadSchedule(); };
  $("fAssignee").onchange = () => { F.assignee = $("fAssignee").value; F.manualEnd = false; fillStarts(); };
  $("fStart").onchange = () => { F.start = $("fStart").value; F.manualEnd = false; updateEnds(); };
  $("fEnd").onchange = () => { F.end = $("fEnd").value; F.manualEnd = true; renderBoard(); };

  function refreshSave() {
    const ok = F.start && F.end && (edit || ((F.customer || F.linkMode) && lines().length));
    $("fSave").disabled = !ok;
    $("fSave").title = ok ? "" : (edit ? "시간을 선택하세요" : "고객·서비스·시간을 선택하세요");
  }
  $("fSave").onclick = async () => {
    $("fSave").disabled = true;
    try {
      if (edit) {
        await api("reservation_update", { mode: "schedule", reservation_id: edit.reservation_id, reservation_date: F.date, start_time: F.start, end_time: F.end, assignee_id: F.assignee });
        toast("일정을 변경했습니다."); m.close(); afterReservationChange(edit.reservation_id, true);
      } else if (F.linkMode) {
        const l = await api("intake_create", {
          reservation_date: F.date, start_time: F.start, end_time: F.end, assignee_id: F.assignee,
          services: lines(), extra_amount: num($("fExtra").value), discount_amount: num($("fDiscount").value),
          extra_reason: $("fExtraReason").value, discount_reason: $("fDiscountReason").value,
          admin_memo: $("fMemo").value, expire_hours: num($("fLinkHours").value)
        });
        m.close(); refreshView(); showIntakeLink(l);
      } else {
        const r = await api("reservation_create", {
          customer_id: F.customer.customer_id, reservation_date: F.date, start_time: F.start, end_time: F.end, assignee_id: F.assignee,
          services: lines(), extra_amount: num($("fExtra").value), discount_amount: num($("fDiscount").value),
          extra_reason: $("fExtraReason").value, discount_reason: $("fDiscountReason").value,
          customer_request: $("fRequest").value, admin_memo: $("fMemo").value, status: $("fConfirmed").checked ? "예약확정" : "예약접수"
        });
        toast("예약을 등록했습니다."); m.close();
        if (opts.onCreated) { try { await opts.onCreated(r); } catch (e) { toast(e.message, true); } }
        afterReservationChange(r.reservation_id);
      }
    } catch (e) { $("fMsg").textContent = e.message; toast(e.message, true); await loadSchedule(); }
    finally { refreshSave(); }
  };
  await loadSchedule();
}

/* ---------- 고객 정보 입력 링크 ---------- */
async function openIntakeLink(id) {
  let l;
  try { l = await api("intake_get", { link_id: id }); } catch (e) { return toast(e.message, true); }
  if (l.state !== "대기") refreshView(true);   // 화면에 남아 있던 '입력대기' 칸을 실제 상태로 새로고침
  // 고객이 이미 입력했으면 링크 창 대신 만들어진 예약을 바로 보여줌
  if (l.state === "완료" && l.reservation_id_done) { toast("고객이 정보를 입력해 예약(예약접수)으로 등록되었습니다."); return openReservationDetail(l.reservation_id_done); }
  showIntakeLink(l);
}
/* 브라우저에서 바로 짧은 주소 만들기 (is.gd JSONP — 서버 권한 불필요) */
function shortenInBrowser(longUrl) {
  return new Promise((res, rej) => {
    const cb = "isgd_cb_" + Date.now() + Math.floor(Math.random() * 1000);
    const s = document.createElement("script");
    const clean = () => { try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { clean(); rej(new Error("시간 초과")); }, 6000);
    window[cb] = d => { clean(); d && /^https:\/\/is\.gd\/[A-Za-z0-9_]+$/.test(d.shorturl || "") ? res(d.shorturl) : rej(new Error((d && d.errormessage) || "실패")); };
    s.onerror = () => { clean(); rej(new Error("연결 실패")); };
    s.src = "https://is.gd/create.php?format=json&callback=" + cb + "&url=" + encodeURIComponent(longUrl);
    document.head.appendChild(s);
  });
}
function isShortUrl(u) { return /^https:\/\/(tinyurl\.com|is\.gd)\//.test(u || ""); }

function showIntakeLink(l) {
  const st = l.state || "대기", waiting = st === "대기";
  const stLabel = { "대기": "고객 입력 대기", "완료": "고객 입력 완료 · 예약접수", "만료": "기한 만료", "취소": "링크 취소됨" }[st] || st;
  const stPill = `<span class="pill ${waiting || st === "완료" ? "info" : "danger"}">${esc(stLabel)}</span>`;
  const m = openModal({
    title: `🔗 고객 입력 링크 ${stPill}`,
    body: `<dl class="kv"><dt>일정</dt><dd>${fullDayLabel(l.reservation_date)} ${esc(l.start_time)}~${esc(l.end_time)}</dd>
        <dt>담당</dt><dd>${esc(adminName(l.assignee_id))}</dd><dt>서비스</dt><dd>${esc(l.service_text)} · ${money(l.final_amount)}</dd>
        <dt>유효기한</dt><dd>${esc(String(l.expires_at || "").slice(0, 16))}</dd></dl>
      ${waiting ? (l.url ? `<p class="small" style="margin-top:12px">아래 내용을 카톡·문자로 고객에게 보내세요. 고객이 입력을 마치면 예약이 자동으로 등록됩니다.</p>
      <textarea id="ilText" rows="4" readonly style="width:100%">${esc(l.message)}</textarea>
      ${l.short_error ? `<div class="xs muted" id="ilShortErr" style="margin-top:4px">※ 짧은 주소를 만들지 못해 원래 주소를 넣었습니다. (${esc(l.short_error)})</div>` : ""}
      <label>고객 휴대폰 번호 (문자로 바로 보낼 때, 선택)<input id="ilPhone" type="tel" inputmode="numeric" placeholder="010-0000-0000"></label>`
        : `<div class="box small red" style="margin-top:12px">${esc(l.url_error || "웹앱 주소를 찾을 수 없습니다.")}</div>`)
      : st === "완료" ? `<div class="box small" style="margin-top:12px">고객이 정보를 입력해 <b>예약접수</b> 상태로 등록되었습니다. 작업이 끝나면 예약 상세에서 [작업완료]를 눌러주세요.</div>`
      : `<div class="box small" style="margin-top:12px">이 링크는 더 이상 쓸 수 없습니다. 필요하면 예약 등록에서 새 링크를 만드세요.</div>`}`,
    foot: (waiting ? `<button class="btn danger" id="ilCancel">링크 취소</button>` : "") +
      (st === "완료" && l.reservation_id_done ? `<button class="btn primary" id="ilOpenRes">예약 보기</button>` : "") +
      (waiting && l.url ? `<button class="btn" id="ilCopy">복사</button><button class="btn" id="ilSms">문자 보내기</button>${navigator.share ? `<button class="btn primary" id="ilShare">카톡 등으로 보내기</button>` : ""}` : "")
  });
  let text = l.message || "";
  // 서버에서 못 줄였으면 브라우저에서 줄여서 문구를 바꾸고 저장
  if (waiting && l.url && !isShortUrl(l.url)) {
    shortenInBrowser(l.url).then(su => {
      text = text.replace(l.url, su); l.message = text; l.url = su; l.short_error = "";
      const ta = m.$("#ilText"); if (ta) ta.value = text;
      const note = m.$("#ilShortErr"); if (note) note.remove();
      api("intake_set_short", { link_id: l.link_id, short_url: su }, { silent: true }).catch(() => {});
    }).catch(() => {});
  }
  const copy = m.$("#ilCopy");
  if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText(text); toast("복사했습니다. 카톡·문자에 붙여 넣으세요."); }
    catch (e) { const t = m.$("#ilText"); t.select(); try { document.execCommand("copy"); toast("복사했습니다."); } catch (e2) { toast("길게 눌러 직접 복사해주세요.", true); } }
  };
  const sms = m.$("#ilSms");
  if (sms) sms.onclick = () => {
    const to = m.$("#ilPhone").value.replace(/[^0-9]/g, "");
    const sep = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? "&" : "?";
    const a = document.createElement("a"); a.href = `sms:${to}${sep}body=${encodeURIComponent(text)}`; a.target = "_top";
    document.body.appendChild(a); a.click(); a.remove();
  };
  const sh = m.$("#ilShare");
  if (sh) sh.onclick = async () => { try { await navigator.share({ text }); } catch (e) { if (!e || e.name !== "AbortError") copy && copy.click(); } };
  const cancel = m.$("#ilCancel");
  if (cancel) cancel.onclick = async () => {
    if (!(await confirmBox("이 링크를 취소할까요?\n고객이 더 이상 입력할 수 없고, 잡아 둔 시간이 풀립니다.", "링크 취소"))) return;
    try { await api("intake_cancel", { link_id: l.link_id }); toast("링크를 취소했습니다."); m.close(); refreshView(); } catch (e) { toast(e.message, true); }
  };
  const openRes = m.$("#ilOpenRes");
  if (openRes) openRes.onclick = () => { m.close(); openReservationDetail(l.reservation_id_done); };
}

function afterReservationChange(id, reopen) {
  Res.customers = null;
  refreshView();
  if (reopen && id) openReservationDetail(id);
}

/* ---------- 예약 상세 ---------- */
async function openReservationDetail(id) {
  if (String(id || "").startsWith("LK")) return openIntakeLink(id);   // 고객 입력 대기 링크
  let r;
  try { r = await api("reservation_get", { reservation_id: id }); } catch (e) { return toast(e.message, true); }
  const done = isDone(r.status), canceled = r.status.includes("취소");
  const c = r.customer || {};
  const m = openModal({
    title: `예약 상세 ${statusPill(r.status)}`, wide: true,
    body: `
      <div class="grid2">
        <div>
          <div class="section-title" style="margin-top:0">일정</div>
          <dl class="kv"><dt>일시</dt><dd class="b">${fullDayLabel(r.reservation_date)} ${esc(r.start_time)}~${esc(r.end_time)}</dd>
            <dt>담당자</dt><dd><span class="dot" style="background:${adminColor(r.assignee_id)}"></span>${esc(adminName(r.assignee_id))} ${telLink(admin(r.assignee_id).phone)}</dd>
            <dt>예약번호</dt><dd class="small muted">${esc(r.reservation_id)}</dd>
            ${r.completed_at ? `<dt>완료</dt><dd>${esc(r.completed_at)}</dd>` : ""}</dl>
        </div>
        <div>
          <div class="section-title" style="margin-top:0">고객</div>
          <dl class="kv"><dt>고객</dt><dd><a href="#" onclick="event.preventDefault();openCustomerDetail('${esc(c.customer_id)}')">${esc(c.name)}</a> <span class="pill">${esc(c.customer_type)}</span></dd>
            <dt>전화</dt><dd>${telLink(c.phone)}</dd>
            <dt>주소</dt><dd>${mapLink([c.address, c.detail_address].filter(Boolean).join(" "))}</dd>
            ${c.memo ? `<dt>고객메모</dt><dd>${esc(c.memo)}</dd>` : ""}</dl>
        </div>
      </div>
      <div class="section-title">서비스·금액</div>
      <div class="box">
        ${r.services.map(s => `<div class="sum-row"><span>${esc(s.service_name)} ×${s.quantity}</span><span>${money(s.amount)}</span></div>`).join("")}
        ${r.extra_amount ? `<div class="sum-row"><span>추가${r.extra_reason ? " (" + esc(r.extra_reason) + ")" : ""}</span><span>+${money(r.extra_amount)}</span></div>` : ""}
        ${r.discount_amount ? `<div class="sum-row"><span>할인${r.discount_reason ? " (" + esc(r.discount_reason) + ")" : ""}</span><span class="red">-${money(r.discount_amount)}</span></div>` : ""}
        ${r.parts.map(p => `<div class="sum-row small"><span>부품: ${esc(p.part_name)} ×${p.quantity}</span><span>${money(p.amount)}</span></div>`).join("")}
        <div class="sum-row total"><span>${done ? "최종 금액" : "예상 금액"}</span><span>${money(r.final_amount)}</span></div>
        ${r.sale ? `<div class="sum-row"><span>입금</span><span class="green">${money(r.sale.paid_amount)}</span></div><div class="sum-row b"><span>미수금</span><span class="${r.sale.remaining ? "red" : ""}">${money(r.sale.remaining)}</span></div>` : ""}
      </div>
      ${r.sale && r.sale.payments.length ? `<div class="section-title">입금 내역</div><div class="box small">${r.sale.payments.map(p => `<div class="sum-row"><span>${esc(p.payment_datetime.slice(0, 16))} · ${esc(p.method)} ${p.status === "취소" ? '<span class="pill danger">취소</span>' : ""}</span><span>${money(p.amount)}</span></div>`).join("")}</div>` : ""}
      <div class="section-title row" style="justify-content:space-between">작업 사진 <span class="row"><button class="btn sm" id="dPhotoBefore">📷 작업전</button><button class="btn sm" id="dPhotoAfter">📷 작업후</button></span></div>
      <div id="dPhotos" class="small muted">${r.photo_count ? '<button class="btn sm" id="dPhotoLoad">사진 ' + r.photo_count + '장 보기</button>' : "사진이 없습니다."}</div>
      <div class="section-title">메모</div>
      <div class="grid2">
        <label>고객 요청사항<textarea id="dReq">${esc(r.customer_request)}</textarea></label>
        <label>관리자 메모<textarea id="dMemo">${esc(r.admin_memo)}</textarea></label>
      </div>
      <div class="right"><button class="btn sm" id="dSaveNotes">메모 저장</button></div>`,
    foot: `
      ${!canceled ? `<button class="btn" id="dInvoice">📄 거래명세서</button>` : ""}
      ${!canceled ? `<button class="btn" id="dBlog">📝 블로그 글</button>` : ""}
      ${!done && !canceled ? `<button class="btn danger" id="dCancel">예약 취소</button>` : ""}
      ${canceled ? `<button class="btn" id="dRestore">취소 되돌리기</button>` : ""}
      ${!done && !canceled ? `<button class="btn" id="dSched">일정 변경</button>` : ""}
      ${r.status === "예약접수" ? `<button class="btn" id="dConfirm">예약 확정</button>` : ""}
      ${r.sale && r.sale.remaining > 0 ? `<button class="btn accent" id="dPay">입금 처리</button>` : ""}
      ${!done && !canceled ? `<button class="btn ok" id="dComplete">작업 완료</button>` : ""}`
  });
  const on = (id, fn) => { const b = m.querySelector("#" + id); if (b) b.onclick = fn; };
  on("dSaveNotes", async () => { await run(() => api("reservation_update", { mode: "notes", reservation_id: id, customer_request: m.$("#dReq").value, admin_memo: m.$("#dMemo").value }), "메모를 저장했습니다."); });
  on("dCancel", async () => {
    const reason = await promptBox("예약을 취소합니다. 취소 사유를 입력하세요 (선택)", "예: 고객 요청");
    if (reason === null) return;
    await run(() => api("reservation_update", { mode: "status", reservation_id: id, status: "취소", reason }), "예약을 취소했습니다.");
    m.close(); refreshView();
  });
  on("dRestore", async () => { await run(() => api("reservation_update", { mode: "status", reservation_id: id, status: "예약접수" }), "취소를 되돌렸습니다."); m.close(); afterReservationChange(id, true); });
  on("dConfirm", async () => { await run(() => api("reservation_update", { mode: "status", reservation_id: id, status: "예약확정" }), "예약을 확정했습니다."); m.close(); afterReservationChange(id, true); });
  on("dSched", () => { m.close(); openReservationForm({ edit: r }); });
  on("dComplete", () => { m.close(); openCompleteForm(r); });
  on("dPay", () => { m.close(); openPaymentForm({ sales_id: r.sale.sales_id, customer_name: c.name, service_name: r.service_text, total_amount: r.sale.total_amount, paid_amount: r.sale.paid_amount, remaining: r.sale.remaining, payments: r.sale.payments }, () => openReservationDetail(id)); });
  on("dInvoice", () => openInvoice(id));
  on("dBlog", () => openBlogDraft(id));
  on("dPhotoLoad", () => loadPhotos(id, m.$("#dPhotos")));
  on("dPhotoBefore", () => pickAndUploadPhoto(id, "작업전", () => loadPhotos(id, m.$("#dPhotos"))));
  on("dPhotoAfter", () => pickAndUploadPhoto(id, "작업후", () => loadPhotos(id, m.$("#dPhotos"))));
}

/* ---------- 작업 완료 ---------- */
async function openCompleteForm(r) {
  let parts = [];
  try { parts = await api("parts", {}, { silent: true }); } catch (e) {}
  const used = (r.parts && r.parts.length ? r.parts : r.suggested_parts).map(p => ({ part_id: p.part_id, quantity: p.quantity }));
  const m = openModal({
    title: "작업 완료", wide: true, sticky: true,
    body: `
      <div class="box small"><b>${esc(r.customer_name)}</b> · ${esc(r.service_text)} · ${dayLabel(r.reservation_date)} ${esc(r.start_time)}</div>
      <div class="section-title">실제 사용 부품 <span class="xs muted" style="font-weight:400">(서비스 기본 부품이 미리 들어가 있어요)</span></div>
      <div id="cParts"></div>
      <div class="row" style="margin-top:6px"><select id="cAddSel" class="grow"><option value="">+ 부품 추가</option>${parts.filter(p => p.active === "Y").map(p => `<option value="${esc(p.part_id)}">${esc(p.part_name)} ${esc(p.model_spec)} (재고 ${p.current_stock})</option>`).join("")}</select></div>
      <div class="grid2">
        <label>추가금액<input type="number" id="cExtra" min="0" step="1000" value="${r.extra_amount || 0}"></label>
        <label>할인금액<input type="number" id="cDisc" min="0" step="1000" value="${r.discount_amount || 0}"></label>
        <label>추가 사유<input id="cExtraR" value="${esc(r.extra_reason || "")}"></label>
        <label>할인 사유<input id="cDiscR" value="${esc(r.discount_reason || "")}"></label>
      </div>
      <div class="box" style="margin-top:12px">
        <div class="sum-row"><span>서비스</span><span>${money(r.service_amount)}</span></div>
        <div class="sum-row"><span>추가 / 할인</span><span id="cAdj"></span></div>
        <div class="sum-row"><span>부품</span><span id="cPartsSum"></span></div>
        <div class="sum-row total"><span>최종 금액</span><span id="cTotal"></span></div>
      </div>
      <div class="section-title">결제</div>
      <div class="grid2">
        <label>지금 받은 금액<input type="number" id="cPay" min="0" step="1000"></label>
        <label>결제수단<select id="cMethod"><option>현금</option><option>계좌이체</option><option>카드</option><option>기타</option></select></label>
      </div>
      <div class="quick" style="margin-top:6px"><button class="btn sm" id="cPayAll">전액 받음</button><button class="btn sm" id="cPayNone">미수 (나중에 받음)</button></div>
      <div class="xs muted" id="cPayMsg"></div>`,
    foot: `<button class="btn" data-x>취소</button><button class="btn ok" id="cSave">작업 완료 처리</button>`
  });
  m.$("[data-x]").onclick = m.close;
  const $ = id => m.querySelector("#" + id);
  let payTouched = false;
  function pinfo(id) { return parts.find(p => p.part_id === id) || (r.suggested_parts || []).find(p => p.part_id === id) || { part_name: id, sale_price: 0, current_stock: 0 }; }
  function render() {
    $("cParts").innerHTML = used.length ? used.map((u, i) => { const p = pinfo(u.part_id); const price = p.sale_price ?? p.unit_price ?? 0; const stock = p.current_stock ?? p.stock ?? 0;
      return `<div class="line" style="grid-template-columns:1fr 70px 100px 34px"><div class="small"><b>${esc(p.part_name)}</b> <span class="muted">${esc(p.model_spec || "")} · 재고 ${stock}</span></div>
        <input type="number" min="0" value="${u.quantity}" data-i="${i}" class="cq"><div class="right small">${money(price * u.quantity)}</div><button class="btn sm ghost" data-del="${i}">✕</button></div>`; }).join("") : '<div class="small muted">사용한 부품이 없으면 그대로 진행하세요.</div>';
    m.$$(".cq").forEach(x => x.oninput = () => { used[x.dataset.i].quantity = Math.max(0, num(x.value)); totals(); });
    m.$$("[data-del]").forEach(x => x.onclick = () => { used.splice(Number(x.dataset.del), 1); render(); });
    totals();
  }
  function totals() {
    const partsSum = used.reduce((a, u) => { const p = pinfo(u.part_id); return a + (p.sale_price ?? p.unit_price ?? 0) * u.quantity; }, 0);
    const ex = num($("cExtra").value), di = num($("cDisc").value);
    const total = Math.max(0, r.service_amount + ex - di) + partsSum;
    $("cAdj").textContent = `+${money(ex)} / -${money(di)}`;
    $("cPartsSum").textContent = money(partsSum);
    $("cTotal").textContent = money(total);
    if (!payTouched) $("cPay").value = total;
    const pay = num($("cPay").value);
    $("cPayMsg").innerHTML = pay >= total ? '<span class="green">완납 처리됩니다.</span>' : `<span class="red">미수금 ${money(total - pay)}이 남습니다.</span>`;
    m.total = total;
  }
  $("cAddSel").onchange = () => { const id = $("cAddSel").value; if (!id) return; const ex = used.find(u => u.part_id === id); if (ex) ex.quantity++; else used.push({ part_id: id, quantity: 1 }); $("cAddSel").value = ""; render(); };
  ["cExtra", "cDisc"].forEach(id => $(id).oninput = totals);
  $("cPay").oninput = () => { payTouched = true; totals(); };
  $("cPayAll").onclick = () => { payTouched = false; totals(); };
  $("cPayNone").onclick = () => { payTouched = true; $("cPay").value = 0; totals(); };
  render();
  $("cSave").onclick = async () => {
    const short = used.filter(u => u.quantity > (pinfo(u.part_id).current_stock ?? pinfo(u.part_id).stock ?? 0));
    if (short.length) return toast("재고가 부족한 부품이 있습니다: " + short.map(u => pinfo(u.part_id).part_name).join(", "), true);
    if (!(await confirmBox(`최종 ${money(m.total)} / 받은 금액 ${money(num($("cPay").value))}\n부품 재고가 차감되고 매출이 생성됩니다. 진행할까요?`, "완료 처리"))) return;
    $("cSave").disabled = true;
    try {
      const res = await api("reservation_complete", { reservation_id: r.reservation_id, parts: used.filter(u => u.quantity > 0), extra_amount: num($("cExtra").value), discount_amount: num($("cDisc").value), extra_reason: $("cExtraR").value, discount_reason: $("cDiscR").value, pay_amount: num($("cPay").value), pay_method: $("cMethod").value });
      toast(res.remaining > 0 ? `작업 완료! 미수금 ${money(res.remaining)}` : "작업 완료! 완납되었습니다.");
      m.close(); refreshView();
    } catch (e) { toast(e.message, true); $("cSave").disabled = false; }
  };
}
</script>

<script>
/* ===== 내 일정 (담당자 모바일 화면) + 작업 사진 ===== */
const My = { date: "", assignee: "" };

Views.myday = {
  async render(el) {
    if (!My.date) My.date = todayStr();
    if (!My.assignee) My.assignee = App.me.admin_id;
    el.innerHTML = `
      <div class="page-head"><h2>내 일정</h2>
        <div class="row">${isSuper() || App.admins.length > 1 ? `<select id="myA" style="width:auto">${adminOptions(My.assignee)}</select>` : ""}</div>
      </div>
      <div class="panel" style="padding:10px">
        <div class="row" style="justify-content:space-between">
          <button class="btn" onclick="myShift(-1)">◀</button>
          <div class="right" style="text-align:center"><div class="b" id="myDate"></div><div class="xs muted" id="myWork"></div></div>
          <button class="btn" onclick="myShift(1)">▶</button>
        </div>
        <div class="quick" style="justify-content:center;margin:8px 0 0"><button class="btn sm" onclick="mySet(0)">오늘</button><button class="btn sm" onclick="mySet(1)">내일</button><input type="date" id="myPick" style="width:auto;padding:5px 8px" onchange="My.date=this.value;myLoad()"></div>
      </div>
      <div id="myList"><div class="empty">불러오는 중...</div></div>`;
    const sel = document.getElementById("myA"); if (sel) sel.onchange = () => { My.assignee = sel.value; myLoad(); };
    await myLoad();
  }
};
function myShift(d) { My.date = addDays(My.date, d); myLoad(); }
function mySet(d) { My.date = addDays(todayStr(), d); myLoad(); }

async function myLoad() {
  document.getElementById("myDate").textContent = fullDayLabel(My.date) + (My.date === todayStr() ? " · 오늘" : "");
  document.getElementById("myPick").value = My.date;
  let d;
  try { d = await api("my_day", { date: My.date, assignee_id: My.assignee }); } catch (e) { return toast(e.message, true); }
  document.getElementById("myWork").textContent = d.off ? "휴무" : "근무 " + d.windows.join(", ");
  const list = document.getElementById("myList");
  const todo = d.reservations.filter(r => !isDone(r.status)).length;
  if (My.date === todayStr() && My.assignee === App.me.admin_id) setNavBadge("myday", todo);
  if (!d.reservations.length) { list.innerHTML = `<div class="panel empty">${d.off ? "휴무일입니다." : "예약이 없습니다."}</div>`; return; }
  list.innerHTML = `<div class="small muted" style="margin:0 2px 8px">총 ${d.reservations.length}건 · 남은 작업 ${todo}건</div>` + d.reservations.map(r => {
    const done = isDone(r.status);
    return `<div class="job ${done ? "done" : ""}" style="border-left-color:${done ? "#9ca3af" : adminColor(r.assignee_id)}">
      <div class="row" style="justify-content:space-between"><span class="job-time">${esc(r.start_time)}~${esc(r.end_time)}</span>${statusPill(r.status)}</div>

/* ---------- 사진 ---------- */
// 사진 선택(휴대폰은 카메라) → 줄여서 업로드
function pickAndUploadPhoto(reservationId, type, after) {
  const m = openModal({
    title: "작업 사진 올리기",
    body: `<div class="tabs" id="phType">${["작업전", "작업후", "기타"].map(t => `<button data-t="${t}" class="${t === type ? "active" : ""}">${t}</button>`).join("")}</div>
      <label class="btn primary block" style="margin:0;padding:14px">📷 사진 찍기 / 선택<input type="file" accept="image/*" multiple id="phFile" hidden></label>
      <label>메모 (선택)<input id="phMemo"></label>
      <div id="phStatus" class="small muted" style="margin-top:10px"></div>`,
    foot: `<button class="btn" data-x>닫기</button>`
  });
  m.$("[data-x]").onclick = m.close;
  let t = type;
  m.$$("#phType button").forEach(b => b.onclick = () => { t = b.dataset.t; m.$$("#phType button").forEach(x => x.classList.toggle("active", x === b)); });
  m.$("#phFile").onchange = async e => {
    const files = [...e.target.files];
    if (!files.length) return;
    const st = m.$("#phStatus");
    let ok = 0;
    for (let i = 0; i < files.length; i++) {
      st.textContent = `올리는 중... (${i + 1}/${files.length})`;
      try {
        const full = await resizeImage(files[i], 1600, 0.82), thumb = await resizeImage(files[i], 360, 0.7);
        await api("photo_upload", { reservation_id: reservationId, photo_type: t, full, thumb, memo: m.$("#phMemo").value });
        ok++;
      } catch (err) { toast(err.message, true); }
    }
    st.textContent = `${ok}장 올렸습니다.`;
    toast(`사진 ${ok}장 저장`);
    e.target.value = "";
    if (after) after();
  };
}

function resizeImage(file, maxSize, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("사진을 읽을 수 없습니다.")); };
    img.src = url;
  });
}

async function loadPhotos(reservationId, box) {
  if (!box) return;
  box.innerHTML = "사진 불러오는 중...";
  try {
    const list = await api("photo_list", { reservation_id: reservationId });
    if (!list.length) { box.innerHTML = "사진이 없습니다."; return; }
    const groups = ["작업전", "작업후", "기타"].map(t => ({ t, items: list.filter(p => p.photo_type === t) })).filter(g => g.items.length);
    box.innerHTML = groups.map(g => `<div class="xs b" style="margin:6px 0 4px">${g.t} ${g.items.length}장</div><div class="photos">${g.items.map(p => `<div class="photo" data-id="${esc(p.photo_id)}" data-by="${esc(p.uploaded_by)}" title="${esc(p.created_at + " " + adminName(p.uploaded_by) + (p.memo ? " · " + p.memo : ""))}">${p.thumb ? `<img src="${p.thumb}" alt="">` : ""}<span class="tag">${esc(p.created_at.slice(5, 16))}</span></div>`).join("")}</div>`).join("");
    box.querySelectorAll(".photo").forEach(el => el.onclick = () => viewPhoto(el.dataset.id, el.dataset.by, () => loadPhotos(reservationId, box)));
  } catch (e) { box.textContent = e.message; }
}

async function viewPhoto(photoId, uploadedBy, after) {
  const m = openModal({ title: "사진", wide: true, body: `<div class="empty">불러오는 중...</div>`, foot: (uploadedBy === App.me.admin_id || isSuper()) ? `<button class="btn danger" data-del>삭제</button><button class="btn" data-x>닫기</button>` : `<button class="btn" data-x>닫기</button>` });
  m.$("[data-x]").onclick = m.close;
  const del = m.$("[data-del]");
  if (del) del.onclick = async () => { if (!(await confirmBox("이 사진을 삭제할까요?", "삭제"))) return; await run(() => api("photo_delete", { photo_id: photoId }), "삭제했습니다."); m.close(); if (after) after(); };
  try { const p = await api("photo_get", { photo_id: photoId }); m.$(".modal-body").innerHTML = `<img src="${p.data}" style="width:100%;border-radius:10px">`; }
  catch (e) { m.$(".modal-body").textContent = e.message; }
}
</script>

<script>
