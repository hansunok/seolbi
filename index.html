<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0768df">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="설비관리">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<base target="_top">
<meta charset="UTF-8">
<title>관리 프로그램</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#e7e9ee; --line2:#f0f1f4; --text:#1f2328; --muted:#6b7280; --faint:#9aa1ab;
  --primary:#1f2328; --accent:#2563eb; --accent-soft:#eff6ff; --danger:#dc2626; --danger-soft:#fef2f2;
  --ok:#16a34a; --ok-soft:#ecfdf3; --warn:#b45309; --warn-soft:#fffbeb; --radius:12px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 10px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d6d9df;border-radius:9px;background:#fff;outline:none;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin:12px 0 0}
label > input,label > select,label > textarea{margin-top:5px;font-weight:400}
label.check{display:flex;gap:8px;align-items:center;font-weight:400}
label.check input{width:auto;margin:0}
[hidden]{display:none !important}
a{color:var(--accent)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border:1px solid transparent;border-radius:9px;background:#eceef2;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover{filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--primary);color:#fff}
.btn.accent{background:var(--accent);color:#fff}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border-color:#d6d9df}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.chip-btn{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}

/* 로그인 */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:32px;box-shadow:var(--shadow)}
.logo{font-size:22px;font-weight:800;text-align:center}
.login-sub{text-align:center;color:var(--muted);margin:4px 0 14px}
.login-box .btn{margin-top:18px;padding:13px}
.form-msg{min-height:20px;margin-top:10px;color:var(--danger);font-size:13px;text-align:center}

/* 레이아웃 */
.topbar{position:sticky;top:0;z-index:50;height:56px;background:#1f2328;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{font-weight:800;font-size:16px}
.top-right{display:flex;gap:8px;align-items:center}
.top-right .btn.ghost{color:#fff;border-color:rgba(255,255,255,.3)}
.app{display:grid;grid-template-columns:210px 1fr;grid-template-rows:56px 1fr;min-height:100vh;background:linear-gradient(to right,#fff 210px,var(--bg) 210px)}
.app .topbar{grid-column:1/-1}
.nav{background:#fff;border-right:1px solid var(--line);padding:12px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.nav button{display:flex;width:100%;gap:10px;align-items:center;padding:10px 12px;border:0;background:transparent;border-radius:9px;cursor:pointer;color:#374151;text-align:left;margin-bottom:2px}
.nav button:hover{background:#f3f4f6}
.nav button.active{background:#1f2328;color:#fff;font-weight:700}
.nav .badge{margin-left:auto}
.main{padding:22px;min-width:0}
.view{display:none}
.view.active{display:block}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:22px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.xs{font-size:12px}
.b{font-weight:700}
.right{text-align:right}
.red{color:var(--danger)}
.green{color:var(--ok)}
.nowrap{white-space:nowrap}

/* 카드/패널 */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card .label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.card .value{font-size:24px;font-weight:800;margin-top:6px}
.card.link{cursor:pointer;transition:transform .12s,box-shadow .12s}
.card.link:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,24,40,.1)}
.card.link .label::after{content:"자세히 ›";color:var(--accent);font-size:12px}
.panel{background:var(--panel);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h3{margin:0;font-size:17px}
.empty{padding:28px;text-align:center;color:var(--faint)}

/* 탭/칩/배지 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;font-weight:600;color:#374151}
.tabs button.active{background:#1f2328;color:#fff;border-color:#1f2328}
.badge{display:inline-block;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;text-align:center}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#f1f2f4;color:#374151;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}

/* 필터 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters > *{width:auto;flex:0 1 auto}
.filters input[type=search],.filters .grow{flex:1 1 200px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* 표 */
.table-wrap{overflow:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:#f8f9fb;color:#4b5563;font-weight:700;text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#fafbff}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}

/* 목록 아이템 (모바일 친화) */
.item{display:flex;gap:12px;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:#fafbff}
.item .main-col{flex:1;min-width:0}
.item .side-col{text-align:right;flex:0 0 auto}
.item .title{font-weight:700}
.item .sub{font-size:13px;color:var(--muted);margin-top:2px}

/* 모달 */
.modal-back{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .14s ease-out}
.modal.wide{max-width:900px}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:18px}
.modal-body{padding:16px 20px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.span2{grid-column:1/-1}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.section-title{font-size:14px;font-weight:800;margin:16px 0 8px;color:#111827}
.box{border:1px solid var(--line);border-radius:10px;padding:12px}
.sum-row{display:flex;justify-content:space-between;padding:4px 0}
.sum-row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:17px}

/* 토스트/로딩 */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:10px;z-index:400;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px}
.toast.err{background:var(--danger)}
.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:500;overflow:hidden;background:transparent}
.busy .spinner{height:100%;width:30%;background:var(--accent);animation:bar 1s infinite ease-in-out}
@keyframes bar{0%{margin-left:-30%}100%{margin-left:100%}}

/* 캘린더 */
.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:12px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-cell{min-height:88px;border:1px solid var(--line);border-radius:9px;padding:5px 6px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;min-width:0}
.cal-cell:hover{border-color:#93c5fd}
.cal-cell.other{background:#fafafa;color:#c2c6cc}
.cal-cell.sel{border:2px solid var(--accent);background:var(--accent-soft)}
.cal-cell .d{font-size:13px;font-weight:700}
.cal-cell.today .d{background:#1f2328;color:#fff;border-radius:999px;padding:0 7px;align-self:flex-start}
.cal-chip{font-size:11px;border-radius:5px;padding:1px 5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-chip.done{opacity:.5}
.cal-more{font-size:11px;color:var(--muted)}

/* 일자 시간표 */
.tl{display:grid;position:relative;border:1px solid var(--line);border-radius:10px}
.tl-head{position:sticky;top:0;z-index:4;background:#f8f9fb;border-bottom:1px solid var(--line);padding:7px;font-size:13px;font-weight:700;text-align:center}
.tl-corner{left:0;z-index:6}
.tl-time{position:sticky;left:0;z-index:3;background:#fff;font-size:11px;color:var(--faint);padding:2px 6px;text-align:right;border-top:1px solid var(--line2);border-right:1px solid var(--line)}
.tl-cell{border-top:1px solid var(--line2);border-left:1px solid var(--line2);min-height:26px}
.tl-off{background:repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6 4px,#e8eaee 4px,#e8eaee 8px)}
.tl-free{background:#f0fdf4;cursor:pointer;position:relative}
.tl-free:hover{background:#bbf7d0}
.tl-free:hover::after,.touch .tl-free::after{content:"+";position:absolute;left:6px;top:2px;font-weight:800;color:#15803d}
.tl-past{background:#fafafa}
.tl-res{margin:2px 3px;border-radius:7px;padding:3px 7px;font-size:12px;color:#fff;overflow:hidden;cursor:pointer;z-index:2;line-height:1.35;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tl-res.done{opacity:.6}

/* 예약 폼의 담당자 막대 */
.board{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafafa;margin-top:12px}
.board-row{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;margin-top:6px}
.board-name{font-size:12px;padding:6px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-align:left}
.board-name.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.board-track{position:relative;height:30px;border-radius:7px;overflow:hidden;background:repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6 6px,#e8eaee 6px,#e8eaee 12px);border:1px solid var(--line)}
.board-track > div{position:absolute;top:0;bottom:0}
.b-work{background:#fff}
.b-free{top:2px !important;bottom:2px !important;background:#bbf7d0;border:1px solid #86efac;border-radius:4px;cursor:pointer}
.b-free:hover{background:#4ade80}
.b-res{top:3px !important;bottom:3px !important;background:#374151;color:#fff;border-radius:5px;font-size:11px;line-height:24px;padding:0 4px;overflow:hidden;white-space:nowrap;z-index:2}
.b-pick{top:1px !important;bottom:1px !important;border:2px solid var(--accent);background:rgba(37,99,235,.2);border-radius:6px;pointer-events:none;z-index:3}
.board-ticks{position:relative;height:14px;font-size:11px;color:var(--faint)}
.board-ticks span{position:absolute;transform:translateX(-50%)}

/* 서비스 줄 */
.line{display:grid;grid-template-columns:1fr 70px 110px 34px;gap:6px;align-items:center;margin-top:6px}
.line input,.line select{padding:8px}

/* 내 일정 카드 */
.job{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px;border-left:5px solid var(--accent)}
.job.done{border-left-color:#9ca3af;opacity:.85}
.job-time{font-size:20px;font-weight:800}
.job-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.job-actions .btn{padding:10px 4px;font-size:13px}

/* 사진 */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photo{position:relative;border-radius:9px;overflow:hidden;background:#f3f4f6;aspect-ratio:1;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .tag{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px}

/* 미수금 */
.bar{height:6px;background:#fee2e2;border-radius:999px;overflow:hidden;margin:7px 0 3px;max-width:380px}
.bar > div{height:100%;background:var(--ok)}
details.group{border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.group summary{display:flex;justify-content:space-between;gap:10px;padding:12px;cursor:pointer;list-style:none}
details.group summary::-webkit-details-marker{display:none}
details.group[open] summary{border-bottom:1px solid var(--line2);background:#fafbfc;border-radius:12px 12px 0 0}

/* 모바일 */
@media (max-width: 860px){
  .app{display:block;background:var(--bg)}
  .nav{position:sticky;top:56px;z-index:40;height:auto;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{width:auto;flex:0 0 auto;padding:8px 12px;font-size:14px;border-radius:999px;margin:0}
  .nav .badge{margin-left:4px}
  .main{padding:12px}
  .cards{grid-template-columns:1fr 1fr;gap:8px}
  .card{padding:12px}
  .card .value{font-size:19px}
  .panel{padding:12px}
  .page-head h2{font-size:19px}
  .grid2,.grid3{grid-template-columns:1fr}
  /* 팝업: 화면 높이에 고정하지 않고 내용만큼 늘어나게 (길면 흰 배경 밖으로 글자가 삐져나오던 문제) */
  .modal-back{padding:0;align-items:flex-start}
  .modal{border-radius:0;min-height:100vh;min-height:100dvh;height:auto;max-width:none;flex-shrink:0}
  .modal-foot{position:sticky;bottom:0;background:#fff}
  .tbl.cards-sm thead{display:none}
  .tbl.cards-sm tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
  .tbl.cards-sm td{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 4px}
  .tbl.cards-sm td::before{content:attr(data-l);color:var(--muted);font-size:12px;flex:0 0 auto}
  .tbl.cards-sm td.num{text-align:right}
  .kv{grid-template-columns:90px 1fr}
}
@media (max-width: 600px){
  .cal{gap:2px}
  .cal-cell{min-height:52px;padding:3px;flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:2px}
  .cal-cell .d{width:100%;font-size:12px}
  .cal-chip{font-size:0;width:8px;height:8px;padding:0;border-radius:50%}
  .cal-more{width:100%;font-size:10px}
  .tl-res{font-size:11px;padding:2px 4px}
  .line{grid-template-columns:1fr 54px 90px 30px}
  .item{flex-direction:column;gap:4px}
  .item .side-col{text-align:left}
}
</style>

</head>
<body>
<!-- 로그인 -->
<div id="loginView" class="login-wrap">
  <form class="login-box" id="loginForm" onsubmit="event.preventDefault();doLogin()">
    <div class="logo" id="loginLogo">&nbsp;</div>
    <div class="login-sub">관리자 로그인</div>
    <label>아이디<input id="loginId" autocomplete="username" required></label>
    <label>비밀번호<input id="loginPw" type="password" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" id="loginRemember" checked> 로그인 상태 유지</label>
    <button class="btn primary block" id="loginBtn">로그인</button>
    <div id="loginMsg" class="form-msg"></div>
    <div style="text-align:center;margin-top:14px;font-size:13px"><span id="companyCodeShow" style="color:#9aa1ab"></span> · <a href="#" onclick="event.preventDefault();askCompany(true)">다른 업체로 접속</a></div>
  </form>
</div>
<!-- 업체 코드 입력 (DB판) -->
<div id="companyView" class="login-wrap" hidden>
  <form class="login-box" onsubmit="event.preventDefault();saveCompany()">
    <div class="logo">업체 코드</div>
    <div class="login-sub">운영자에게 받은 업체 코드를 입력해 주세요</div>
    <label>업체 코드<input id="companyCodeInput" required autocomplete="organization" placeholder="예: bichium"></label>
    <button class="btn primary block">확인</button>
  </form>
</div>
<script>
function askCompany(change) {
  if (change) { try { localStorage.removeItem("company_code"); } catch (e) {} }
  location.href = location.pathname + (change ? "?c=" : "");
}
function saveCompany() {
  const c = document.getElementById("companyCodeInput").value.trim().toLowerCase();
  if (c) location.href = location.pathname + "?c=" + encodeURIComponent(c);
}
document.addEventListener("DOMContentLoaded", () => {
  const show = document.getElementById("companyCodeShow");
  if (show) show.textContent = "업체 코드: " + (window.COMPANY_CODE || "-");
  if (!window.COMPANY_CODE) { document.getElementById("loginView").hidden = true; document.getElementById("companyView").hidden = false; }
});
</script>

<!-- 처음 설정 (관리자 계정이 하나도 없을 때) -->
<div id="setupView" class="login-wrap" hidden>
  <form class="login-box" style="max-width:440px" onsubmit="event.preventDefault();doInitialSetup()">
    <div class="logo">처음 설정</div>
    <div class="login-sub">업체 정보와 최고관리자 계정을 만들어 주세요</div>
    <label>업체명 *<input id="isCompany" required placeholder="예: 행복설비"></label>
    <label>대표 전화<input id="isPhone" inputmode="tel"></label>
    <label>관리자 이름 *<input id="isName" required></label>
    <label>아이디 * (영문/숫자)<input id="isLogin" required autocomplete="username"></label>
    <label>비밀번호 * (6자 이상)<input id="isPw" type="password" required autocomplete="new-password"></label>
    <label>비밀번호 확인 *<input id="isPw2" type="password" required autocomplete="new-password"></label>
    <label class="check"><input type="checkbox" id="isSample" checked> 예시 서비스 5개 넣기 (나중에 수정·삭제 가능)</label>
